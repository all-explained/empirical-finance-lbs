format: goal/v2
id: course-site
title: 'Empirical Finance course site: scaffold and reference chapters'
objective: Build the site, curriculum, style guide and real-data pipeline for an interactive 3Blue1Brown-style course on empirical asset pricing (from zero to PhD level, following the LBS E164 topic list), and finish two polished reference chapters that later chapters copy.
base: main
success:
  SC-1: The site builds and deploys to https://all-explained.github.io/empirical-finance-lbs/ on the options-explained stack; verified by `npm test`, `npm run build`, `npm run screenshots` (no console, KaTeX or overflow errors) and `curl` returning 200 for the home page.
  SC-2: docs/CURRICULUM.md lists every chapter (a foundations part first, then one or more parts per outline week) with goals, key math, planned widgets, datasets and prerequisites; every "Concepts covered" item of the outline maps to a chapter; verified by the coverage table in the PR and `src/data/curriculum.ts` matching the file.
  SC-3: docs/STYLE_GUIDE.md fixes voice, chapter template, notation table, colour semantics and widget rules for this course, and every notation macro exists in src/lib/katexMacros.ts; verified by `npm test` and `npm run build`.
  SC-4: Real public data (Ken French library, Shiller, Goyal–Welch, FRED) is downloaded by one script into small committed JSON files with source and citation, and loaded through typed helpers in src/lib with Vitest reference-value tests; verified by `npm run data` and `npm test`.
  SC-5: Two reference chapters follow the template, use real data in at least one widget, and pass build, screenshots and a Playwright click-through; the owner approves how they read.
  SC-6: The LBS outline PDF never enters git, and no outline text is copied verbatim; verified by `git log --all --name-only | grep -ci pdf` returning 0.
milestones:
  - {id: M-1, title: Site and plan, success: [SC-1, SC-2, SC-3, SC-4, SC-6], exit: Scaffold, curriculum, style guide and data PRs merged; site live; reference chapters chosen}
  - {id: M-2, title: Reference chapters, success: [SC-5, SC-6], exit: Both reference chapter PRs merged; build and screenshots clean; owner approves how they read}
policy:
  decide: human         # human | experts (a committee answers worker decision requests)
  orchestrator: {platform: claude, model: sonnet, effort: medium}
  max_parallel: 7
  default_route: {platform: claude, model: sonnet, effort: high}
  agent: claude         # claude | codex | opencode | agy
  turn_budget: 40
  plan_commits: push    # push | commit | off
  worktree_setup: "if [ -f package-lock.json ]; then npm ci; fi"
