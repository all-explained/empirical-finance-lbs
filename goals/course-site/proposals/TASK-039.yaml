add:
  - ref: lib-bonds
    title: 'Library: zero-coupon curves, forward and par rates, bond holding returns and the expectations-hypothesis yield'
    milestone: M-13
    why: >-
      SC-7 and M-13. Part XI starts from the arithmetic of bonds: prices, yields, forward rates, par yields and the
      return of buying an n-year bond and selling it a year later. All three chapters of the Part use it, and Part XII
      builds affine models on it. `src/lib` has no bond code: `src/lib/stats/pca.ts` only turns the GSW yields into
      monthly changes for Chapter 6. Both datasets the Part needs, `gsw-zero-coupon` and `fred-treasury-monthly`,
      are committed, so this task starts at once.
    scope: |-
      Add `src/lib/finance/bonds.ts` and `src/lib/finance/bonds.test.ts`. Read first: the entries of chapters 40–42 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the "Bonds and the term structure" table, the Returns and prices table and the Probability and statistics table), the `gsw-zero-coupon` and `fred-treasury-monthly` rows and build notes of `docs/DATA.md`, `src/lib/data/series.ts` (`getColumn`, `betweenDates`), `src/lib/stats/pca.ts` (`gswYieldChanges` and its private `panel`), `src/lib/finance/returns.ts` and `src/lib/finance/predictive.ts` (`fitAR1`).

      Readings. Open these PDFs with `pdftotext -layout` and cite pages in doc comments for anything you take from them:
      - `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/CochranePiazzesi2005.pdf` (the published *American Economic Review* article; journal page = pdf page + 137): the log forward rate, the log holding-period return and the log excess return, pdf p. 4 (journal p. 141).
      - `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/CampbellShiller1991.pdf` (NBER working paper 3153, October 1989; cite the 1991 *Review of Economic Studies* article and name working-paper pdf pages): the expectations hypothesis as an average of expected short rates plus a constant, eq. (1), pdf p. 6; the perfect-foresight spread, eq. (3), pdf pp. 8–9; coupon bonds as portfolios of zero-coupon bonds, pdf p. 15. The text layer is OCR and garbled in places: check any formula or number against the page image (`pdftoppm -png -r 150 -f N -l N`).
      Campbell, Lo & MacKinlay (1997), Ch. 10, and Cochrane (2005), Ch. 19, are books that are not in `source/papers/` (see `docs/READINGS.md`): take no fact from them. Gürkaynak, Sack & Wright (2007) is the data citation of `gsw-zero-coupon`, not a reading: state about it only what `docs/DATA.md` states.

      Functions (decimal log rates per year; one period is one year, observed every month):
      - `gswCurve(series)`: the dates, the maturities 1–30 and the T × 30 matrix of log yields $y^{(n)}_t$, from `SVENY01`–`SVENY30` (continuously compounded, percent, so $y^{(n)}_t$ is the column over 100). Reuse the panel logic of `pca.ts`; do not copy it (export a shared helper there if needed, with its test).
      - `logPrices(curve)`: $p^{(n)}_t = -n\,y^{(n)}_t$. `forwardRates(curve)`: $f^{(1)}_t = y^{(1)}_t$ and $f^{(n)}_t = p^{(n-1)}_t - p^{(n)}_t$.
      - `parYields(curve, frequency)`: the coupon rate at which a bond of each maturity is priced at par, from the discount factors $e^{p^{(n)}_t}$. With `frequency: 1` it is exact on the integer grid. With `frequency: 2` (the convention of the Treasury's constant-maturity yields) it needs half-year discount factors: interpolate the log yield linearly between integer maturities and hold it flat below one year, and name that limit in a code comment.
      - `holdingReturns(curve, n)`: for each month $t$, $r^{(n)}_{t+1} = p^{(n-1)}_{t+1} - p^{(n)}_t$ and $rx^{(n)}_{t+1} = r^{(n)}_{t+1} - y^{(1)}_t$, where $t + 1$ is the month twelve months later. Match dates by calendar month, never by row offset, and return no value where the later month is missing. The observations overlap by eleven months; say so in the doc comment.
      - `returnDecomposition(curve, date, n)`: the exact identity $r^{(n)}_{t+1} = y^{(n)}_t - (n - 1)\,(y^{(n-1)}_{t+1} - y^{(n)}_t)$, derived in a doc comment, split into the yield, the roll-down at an unchanged curve, $-(n - 1)(y^{(n-1)}_t - y^{(n)}_t)$, and the shift of the curve, $-(n - 1)(y^{(n-1)}_{t+1} - y^{(n-1)}_t)$; also the simple return and the excess return. The parts sum to $r^{(n)}_{t+1}$.
      - `perfectForesightYield(curve, n)`: $\frac1n\sum_{j=0}^{n-1} y^{(1)}_{t+j}$ from the realised one-year yields $j$ years later (matched by month), and the ex post term premium, the yield minus it. Missing where the sample ends too early.
      - `treasuryCurve(series)`: the `fred-treasury-monthly` maturities 1, 2, 3, 5, 7, 10, 20 and 30 years as decimal par yields with semi-annual coupons, and `billBondEquivalent(discountRate, days)`: TB3MS from the discount basis to a bond-equivalent yield (derive the formula in a doc comment from the price of a bill). The rows are not contiguous: the committed file has no months from 1987-01 to 1993-09, because it keeps complete months only and FRED has no 20-year yield then. Keep the dates and never fill the gap. `docs/DATA.md` does not state the gap yet: add it to the coverage cell of the `fred-treasury-monthly` row, with its reason.

      Notation. §3 already defines $n$, $P^{(n)}_t$, $p^{(n)}_t$, $y^{(n)}_t$, $f^{(n)}_t$ and $rx^{(n)}_{t+1}$. Add rows to the "Bonds and the term structure" table of §3 for the log holding-period return $r^{(n)}_{t+1}$ (compare the stock return $r_{t+1}$), the par yield, and the ex post term premium (choose a symbol Part XII can keep for the term premium, for example $\mathit{tp}^{(n)}_t$), each with the clash it avoids. Do not start a Part XI block: bond symbols live in that table. The other two Part XI library tasks add rows to the same table; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: on a flat curve every forward rate equals the yield, the annual par yield is $e^{y} - 1$, and the semi-annual one is $2(e^{y/2} - 1)$; $y^{(n)}_t$ is the mean of $f^{(1)}_t, \dots, f^{(n)}_t$ to 1e-14 on the committed data; a par bond priced with the curve's discount factors is worth 1 to 1e-12; the parts of `returnDecomposition` sum to the return to 1e-14; on a curve that never moves, the realised excess return of every maturity equals the roll-down term alone, and on a flat curve that never moves it is 0; `holdingReturns` returns nothing across a missing month (build a fixture with a gap); `perfectForesightYield` of a constant short rate is that rate; `billBondEquivalent` matches a hand computation; pinned values on the committed data for one date (the 1-, 10- and 30-year yields, forwards and annual par yields at the end of 2000) and for `treasuryCurve` at one month; and the GSW semi-annual par yields against the FRED constant-maturity yields of the same months, 1993-10 to 2026-09, within a stated mean absolute gap at 2, 5 and 10 years (report the measured gaps, and say in the doc comment that FRED's yields are monthly averages while GSW's are end of month). Reuse `getColumn`, `betweenDates` and the panel logic of `pca.ts`; do not copy them. Out of scope: chapters, widgets, regressions, and edits to files other than those named (in `docs/DATA.md`, only the coverage cell above).
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - 'The outcome reports the measured mean absolute gaps between GSW par yields and FRED constant-maturity yields at 2, 5 and 10 years.'
      - '`docs/STYLE_GUIDE.md` §3 "Bonds and the term structure" has rows for the holding-period return, the par yield and the term premium, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/bonds.ts`, its test, `src/lib/stats/pca.ts` and its test if a shared helper was exported there, `docs/STYLE_GUIDE.md`, `docs/DATA.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-expectations-hypothesis
    title: 'Library: Campbell–Shiller and Fama–Bliss regressions by maturity and a seeded expectations-hypothesis world'
    milestone: M-13
    after: [lib-bonds]
    why: >-
      SC-7 and M-13. Chapter 41 tests the expectations hypothesis: does the yield spread forecast the change in long
      yields with slope 1, and do forward spreads forecast excess returns? It needs the regressions at every maturity
      with standard errors that respect eleven months of overlap, and a seeded world where the hypothesis holds, so
      the reader can see how far a sample of our length strays from slope 1 by chance. `predictive.ts` runs
      return regressions on one predictor and `ols.ts` has Hansen–Hodrick errors; nothing builds the bond regressions.
      It needs the curve arithmetic of the bond library.
    scope: |-
      Add `src/lib/finance/expectationsHypothesis.ts` and its test file. Read first: the entry of chapter 41 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the "Bonds and the term structure" table, the predictability table and the Probability and statistics table), `src/lib/finance/bonds.ts` (from the library task this task depends on), `src/lib/stats/ols.ts` (`ols` with `errors: 'hansen-hodrick'` and `'newey-west'`), `src/lib/finance/predictive.ts` (`predictiveRegression`, `fitAR1`), `src/lib/stats/autocorr.ts` and `src/lib/math/rng.ts`.

      Readings. Open these PDFs with `pdftotext -layout` and cite pages in doc comments for anything you take from them:
      - `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/CampbellShiller1991.pdf` (NBER working paper 3153, October 1989; cite the 1991 *Review of Economic Studies* article and name working-paper pdf pages; the text layer is OCR and garbled in places, so check every formula and number against the page image, `pdftoppm -png -r 150 -f N -l N`): the expectations hypothesis, eq. (1), pdf p. 6; the yield-change regression and why its slope should be 1, eq. (2), pdf p. 8; the perfect-foresight spread regression, eq. (3), pdf pp. 8–9; the McCulloch data, 1952–1987, pdf p. 15; the results, pdf pp. 16–19, with Table 1a on pdf pp. 28–29 and Table 2 on pdf pp. 31–32; the Monte Carlo under the hypothesis, pdf pp. 20–22; time-varying term premia and the "overreaction" reading, pdf pp. 23–27.
      - `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/CochranePiazzesi2005.pdf` (published; journal page = pdf page + 137): the Fama–Bliss forward-spread regressions, pdf p. 8 (journal p. 145, Table 2), and the standard errors for overlapping annual returns, pdf p. 6 (Table 1, "HH, 12 lags" and "NW, 18 lags").
      Campbell, Lo & MacKinlay (1997), Ch. 10, is not in `source/papers/`: take no fact from it. Fama & Bliss (1987) is not in `source/papers/` either: name it only where Cochrane & Piazzesi or Campbell & Shiller do, with their page.

      Functions (annual holding periods on monthly observations, decimal log rates; standard errors Hansen–Hodrick with 12 lags by default, as Cochrane & Piazzesi's Table 1, with options for Newey–West with 18 lags and for non-overlapping annual observations):
      - `yieldChangeRegression(curve, n, options)`: $y^{(n-1)}_{t+1} - y^{(n)}_t$ on $(y^{(n)}_t - y^{(1)}_t)/(n - 1)$, the curriculum's Key math; slope, standard error, $t$-statistic against 1 and against 0, $R^2$, the dates used, and the points for a scatter.
      - `perfectForesightRegression(curve, n, options)`: the perfect-foresight spread from `perfectForesightYield` minus $y^{(1)}_t$ on the actual spread $y^{(n)}_t - y^{(1)}_t$, slope 1 under the hypothesis.
      - `forwardSpreadRegression(curve, n, options)`: $rx^{(n)}_{t+1}$ on $f^{(n)}_t - y^{(1)}_t$, slope 0 under the hypothesis, and the matching regression of $y^{(1)}_{t+n-1} - y^{(1)}_t$ on the same spread, slope 1 under the hypothesis; for $n = 2$ the two slopes sum to 1 (derive why in a doc comment).
      - `slopesByMaturity(curve, regression, maturities, options)`: each regression at each maturity, with the value the hypothesis implies.
      - `simulateExpectationsWorld(seed, params, options)`: a seeded monthly path of the one-year yield, an AR(1) fitted to the data's one-year yield with `fitAR1`, and long yields priced by the hypothesis on the annual grid, $y^{(n)}_t = \frac1n\sum_{j=0}^{n-1}\mathbb{E}_t y^{(1)}_{t+j} + c^{(n)}$ (closed form from the AR(1)), with an option that adds a time-varying term premium, an independent AR(1) with a loading on each maturity, so the yield-change slope falls below 1 and can turn negative. Return a curve in the shape `gswCurve` returns, so every regression above runs on it unchanged.
      - `populationSlope(params, n)`: the yield-change slope the simulated world implies, derived in a doc comment, with and without the term premium.
      - `slopeDistribution(seed, params, n, options)`: the slopes of many seeded samples as long as ours under the hypothesis, their quantiles, and the share at or below the data's slope, as Campbell & Shiller's Monte Carlo does (pdf pp. 20–22); state the number of samples and the time one call takes on the test machine, which must stay low enough for a widget button (say what you measured).

      Notation. §3 gives $b$ to SDF loadings and predictive slopes, $s$ to states, shares and the log surplus ratio, $S$ to the GMM long-run covariance and the surplus ratio, and $\phi$ to AR(1) persistence. Choose symbols for the yield spread (for example $\mathit{sp}^{(n)}_t$), the perfect-foresight spread, the term-premium constant $c^{(n)}$ and the persistence of the simulated short rate and term premium, and write the regression slopes so they do not read as SDF loadings (say how). Add each to the "Bonds and the term structure" table of §3, with the clash it avoids and the papers' symbol. The other two Part XI library tasks add rows to the same table; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: on a curve simulated without a term premium, the slopes of a very long seeded path are within a stated band of 1 for the yield-change and perfect-foresight regressions and of 0 for the forward-spread regression; with the term premium they are within a stated band of `populationSlope`; the two $n = 2$ forward-spread slopes sum to 1 to 1e-12 on the committed data; the Hansen–Hodrick standard error equals a hand computation on a small fixture; `slopeDistribution` is reproducible from its seed and its median lies near 1; and pinned values on the committed `gsw-zero-coupon` for each regression at $n = 2$, 5 and 10. Reuse `ols`, `fitAR1`, the functions of `bonds.ts` and the RNG helpers; do not copy them. Out of scope: chapters, widgets, and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - 'The outcome lists the slopes on our data at 2, 5 and 10 years next to the m = 12 column of Campbell & Shiller''s Table 1a (pdf p. 28) and Cochrane & Piazzesi''s Table 2 (pdf p. 8), marked as theirs, and says why they differ (sample, data, maturities).'
      - 'The outcome states the number of samples and the measured time of one `slopeDistribution` call.'
      - '`docs/STYLE_GUIDE.md` §3 "Bonds and the term structure" has rows for the new symbols, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/expectationsHypothesis.ts`, its test, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-bond-risk-premia
    title: 'Library: the Cochrane–Piazzesi tent factor, its single-factor loadings and forecasts with yield principal components'
    milestone: M-13
    after: [lib-bonds]
    why: >-
      SC-7 and M-13. Chapter 42 shows that one combination of forward rates, shaped like a tent, forecasts the excess
      returns of bonds of every maturity, and that level, slope and curvature miss most of it. It needs the
      Cochrane–Piazzesi regressions, the single-factor loadings, forecasts with principal components of yield levels,
      and the tent on subsamples. `pca.ts` has principal components but only of yield changes; nothing runs the
      regressions. It needs the curve arithmetic of the bond library.
    scope: |-
      Add `src/lib/finance/bondRiskPremia.ts` and its test file, and add `gswYieldLevels` to `src/lib/stats/pca.ts` with its test. Read first: the entry of chapter 42 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the "Bonds and the term structure" table, the Factor models table, where $f_t$ is a factor, and the Probability and statistics table), `src/lib/finance/bonds.ts` (from the library task this task depends on), `src/lib/stats/pca.ts` (`pca`, `scores`, `gswYieldChanges`), `src/lib/stats/ols.ts` and `src/lib/math/linalg.ts`.

      Readings. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/CochranePiazzesi2005.pdf` (the published *American Economic Review* article; journal page = pdf page + 137; cite journal pages) with `pdftotext -layout`, and cite pages in doc comments for anything you take from it: notation, the forward-rate vector with its intercept and the average excess return across maturities 2–5, p. 141; the unrestricted regressions, eq. (1), the single-factor model, eq. (2), and the two-step estimate, p. 142; Table 1 (the factor, its standard errors and $R^2$, and the loadings $b_n$), p. 143; the tent in Figure 1, p. 140; the Fama–Bliss data of one- to five-year zero-coupon bonds, 1964–2003, p. 142 and the note of Table 1; principal components of yields and forecasts with them, Figure 2, p. 141, and Table 4 with the variance shares of the five components, p. 147; measurement error, pp. 151–153. The paper's Appendix, which it cites for subsample stability (p. 159), is not in `source/papers/`: take no fact from it.

      Functions (annual holding periods on monthly observations, maturities 1–5 years as in the paper, decimal log rates; Hansen–Hodrick standard errors with 12 lags by default, with Newey–West with 18 lags as an option, as Table 1):
      - `cpInputs(curve, range)`: for each month, the forward-rate vector $[1, y^{(1)}_t, f^{(2)}_t, \dots, f^{(5)}_t]$, the excess returns $rx^{(n)}_{t+1}$ for $n = 2, \dots, 5$ from `holdingReturns`, and their average across maturities.
      - `tentFactor(inputs, options)`: the weights of the regression of the average excess return on the forward-rate vector, their standard errors, $R^2$, and the factor series (the weights times the vector).
      - `singleFactorLoadings(inputs, weights)`: the loadings $b_n$ from regressions of each $rx^{(n)}_{t+1}$ on the factor, their standard errors and $R^2$, against the unrestricted regressions on all forward rates (Figure 1, p. 140); the four loadings average to 1 (derive why in a doc comment).
      - `gswYieldLevels(series, maturities)` in `pca.ts`: the panel of yield levels, decimal, next to `gswYieldChanges`, through the same private helper.
      - `yieldFactorForecasts(inputs, curve)`: the principal components of the 1- to 5-year yield levels with `pca`, their variance shares, and the $R^2$ of the average excess return on the level, on level and slope, on level, slope and curvature, and on all five (which equals the tent's), as Table 4 (p. 147); the share of the factor's variance the first three components explain.
      - `subsampleTents(curve, ranges)`: `tentFactor` on named date ranges. Default ranges: the full sample from 1985-11, the months it shares with the paper's sample (to 2003-12), and the months after the paper's sample (from 2004-01). Each range is stated by its first and last month of $t$.

      Notation. §3 keeps $\gamma$ for risk aversion only, $b$ for SDF loadings, $f_t$ for a vector of factors and a bar for a sample mean. The paper writes $\gamma$ for the tent weights, $f_t$ for the forward-rate vector, $b_n$ for the loadings and $\overline{rx}_{t+1}$ for the average excess return. Choose a symbol for each that avoids those clashes (for example $\vartheta$ for the weights, a bold or upright symbol for the forward-rate vector, $b^{(n)}$ with the maturity superscript, and an italic name such as $\mathit{cp}_t$ in the `\Signal` colour for the factor), and write the average excess return so it does not read as a sample mean. Add each to the "Bonds and the term structure" table of §3, with the clash it avoids and the paper's symbol. The other two Part XI library tasks add rows to the same table; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: on simulated data whose average excess return is an exact linear function of the forward rates plus seeded noise, `tentFactor` recovers the weights within a stated band; when every $rx^{(n)}$ is $b_n$ times one factor plus noise, `singleFactorLoadings` recovers $b_n$ and the restricted and unrestricted $R^2$ are close; the loadings average to 1 to 1e-12 on the committed data; the five-component $R^2$ equals the tent's $R^2$ to 1e-10; the variance shares sum to 1; `gswYieldLevels` differenced equals `gswYieldChanges` to 1e-14; and pinned values on the committed `gsw-zero-coupon` for the weights, $R^2$ and loadings on each default range. Reuse `holdingReturns`, `forwardRates`, `pca`, `scores` and `ols`; do not copy them. Out of scope: chapters, widgets, and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - 'The outcome compares the weights, $R^2$ and loadings on each default range with Cochrane & Piazzesi''s Table 1 (p. 143), marked as theirs, says whether our weights are tent-shaped, and says why they may differ (sample years, GSW fitted curves against Fama–Bliss prices).'
      - '`docs/STYLE_GUIDE.md` §3 "Bonds and the term structure" has rows for the new symbols, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/bondRiskPremia.ts`, its test, `src/lib/stats/pca.ts`, its test, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: chapter-40
    title: 'Chapter 40: Yields, forwards and bond returns'
    milestone: M-13
    after: [lib-bonds]
    why: >-
      SC-7 and M-13. Part XI opens with the language of bonds: how prices, yields, forward rates and holding-period
      returns are one set of numbers seen four ways, what the US yield curve has looked like since 1985, and what the
      expectations hypothesis says. This chapter follows the pattern of the Part I to Part X chapters.
    scope: |-
      Write chapter 40 of `docs/CURRICULUM.md`, "Yields, forwards and bond returns", as `src/content/chapters/40-yields-forwards-and-bond-returns.mdx`, with its widgets. Read first: the chapter's entry in `docs/CURRICULUM.md`, all of `docs/STYLE_GUIDE.md` (with the "Bonds and the term structure" table of §3), `docs/DATA.md`, the finished chapters `src/content/chapters/01-returns.mdx` (log returns and `ReturnCalculator`), `src/content/chapters/06-principal-components.mdx` (where the reader first met GSW yield changes) and `src/content/chapters/08-euler-equation-and-sdf.mdx` (a price as an expected discounted payoff), and the code named below: `src/lib/finance/bonds.ts` (from the library task this task depends on) and `src/components/plots/seriesSample.ts` (`useSeriesData`). Check each file name with `ls src/content/chapters/` before you link it.

      Readings. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/CochranePiazzesi2005.pdf` (published; journal page = pdf page + 137) for the definitions of forward rates and holding-period returns (p. 141), and `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/CampbellShiller1991.pdf` (NBER working paper 3153; cite the 1991 *Review of Economic Studies* article and name working-paper pdf pages; check its OCR text against the page image) for the expectations hypothesis, eq. (1), pdf p. 6, and coupon bonds as portfolios of zero-coupon bonds, pdf p. 15. The library's doc comments list these pages. Campbell, Lo & MacKinlay (1997), Ch. 10, and Cochrane (2005), Ch. 19, are not in `source/papers/`: list them under further reading in the short form and take no fact from them. Cite readings in the short form. Explain ideas in your own words; never copy text, figures or tables, and never copy from the LBS outline. State no fact or number as taken from a reading you have not opened. A number in the prose that comes from our data is read from library output, never from a paper.

      Data. `gsw-zero-coupon` (end-of-month zero-coupon yields, 1985-11 to 2026-09) for every curve and return, and `fred-treasury-monthly` for the Treasury's constant-maturity par yields on the par view, loaded through one hook in `src/components/plots/bondSample.ts` built on `useSeriesData`; write no new loading code that an existing hook already covers. Chapters 41 and 42 reuse that hook. Say in the caption that FRED's yields are monthly averages with semi-annual coupons, that GSW's are end of month, and that FRED has no months from 1987-01 to 1993-09.

      Chapter:
      - Frontmatter: `part: 11`, `chapter: 40`, `difficulty: 2`, `prerequisites: [1]`, a one-sentence `summary`. Link chapters 1, 6 and 8, and chapter 35 where the risk-free rate appears. Every sentence about another chapter must be true of the merged site; name chapter 41, "Testing the expectations hypothesis", only in "Recap & next up" by title.
      - The six sections in the template order with `section-tag` headings, 1,500–3,000 words of prose, 2–3 `Quiz` questions.
      - Cover the Goals and the Key math of the chapter's curriculum entry, with no step skipped: $p^{(n)}_t$ and $y^{(n)}_t$, the forward rate as the rate locked in today for a loan from $n - 1$ to $n$ and the yield as the average of forwards, the par yield, the holding-period return and its exact split into the yield, the roll-down and the shift of the curve, the excess return, and the expectations hypothesis with its constant. Read the curve on our data: its usual slope, the months it was inverted, and the mean excess return by maturity since 1985. Show with `perfectForesightYield` how a long yield compares with the short rates that followed it, and say plainly that this is hindsight, not a test (chapter 41 tests it).
      - Every number in the prose is read from library output on the committed data, never typed from memory. Add `tests/chapter40-numbers.test.ts` that recomputes each one, as `tests/chapter16-numbers.test.ts` does, and list each number with its test in the outcome.

