  - ref: data-french-sorts-daily
    title: 'Data: French 2×3 sorts and daily factors'
    milestone: M-7
    why: >-
      SC-4, SC-7 and M-7. Chapters 19 and 20 rebuild SMB, HML and the momentum factor from the 2×3 sorts behind
      them, and chapter 23 runs within-quarter regressions on daily returns, as Lewellen & Nagel (2006) do. None of
      these four public French files is in the pipeline yet.
    scope: |-
      Add four datasets to the data pipeline, all from the Kenneth French Data Library, with no credentials. Set up `.venv` as `docs/DATA.md` describes before `npm run data`. Read first: `docs/DATA.md` (file contract and French notes), `scripts/data/fetch.py` (its `french()` helper and the French entries in `build_all`), `src/lib/data/series.ts` and `src/lib/data/series.test.ts`.

      Datasets (keep source units: percent per period; first table only, value-weighted returns; drop `-99.99` and `-999`):
      - `ff6-size-bm-monthly`: "6 Portfolios Formed on Size and Book-to-Market (2 x 3)" (`6_Portfolios_2x3_CSV.zip`). Columns `SMALL-LoBM`, `ME1-BM2`, `SMALL-HiBM`, `BIG-LoBM`, `ME2-BM2`, `BIG-HiBM` as in the source header, or a clear renaming documented in `docs/DATA.md`.
      - `ff6-size-mom-monthly`: "6 Portfolios Formed on Size and Momentum (2 x 3)" (`6_Portfolios_ME_Prior_12_2_CSV.zip`). Same rule for column names.
      - `ff3-daily`: "Fama/French 3 Factors [Daily]" (`F-F_Research_Data_Factors_daily_CSV.zip`), columns `Mkt-RF`, `SMB`, `HML`, `RF`, from 1963-07-01 on to keep the file small.
      - `mom-daily`: "Momentum Factor (Mom) [Daily]" (`F-F_Momentum_Factor_daily_CSV.zip`), column `Mom`, from 1963-07-01 on.
      Check each file name and header against the download before you use it; if the library has renamed a file, use the current name and record it. Daily dates are trading days in ISO form. In `docs/DATA.md`, add the four rows to the sources table (terms and citations as for the other French files), update the dataset count in the opening line, and add a bullet under "File contract and transformations" that says how each 2×3 sort is formed (the breakpoints and timing as the library page states them) and that the daily files start in 1963-07 by choice.

      Another data task (`data-osap`) may merge first and touch the same files. Rebase on `origin/main` before you finish and keep both sets of entries. Touch only: `scripts/data/fetch.py`, the four new JSON files in `src/data/series/`, `src/lib/data/series.ts` (four new `seriesColumns` entries), `src/lib/data/series.test.ts` (schema test and three raw-source cells per dataset, as for the others) and `docs/DATA.md`. `npm run data` rebuilds every dataset; if it changes any other JSON file, restore it with `git checkout -- <file>` and say so in the outcome. Each JSON file stays under 1 MB. Out of scope: library maths, chapters and widgets. If a download is blocked, stop with `Goal-Blocked` and name the exact file the owner must download.
    acceptance:
      - '`npm run data` writes the four JSON files, and the outcome states each file''s first and last date, row count and size.'
      - '`npm test` passes, including the new schema and raw-cell tests.'
      - '`npm run build` passes.'
      - '`git status --short` shows only the files named above and this task''s outcome file.'
    verify: |-
      npm ci
      npm run data
      git status --short
      npm test
      npm run build
      du -k src/data/series/ff6-size-bm-monthly.json src/data/series/ff6-size-mom-monthly.json src/data/series/ff3-daily.json src/data/series/mom-daily.json
  - ref: data-osap
    title: 'Data: published anomaly portfolios from Open Source Asset Pricing'
    milestone: M-7
    why: >-
      SC-4, SC-7 and M-7. Chapter 21 plots published return predictors by year with their t-statistics and shows
      how many shrink when portfolios are value-weighted or microcaps are dropped. `docs/CURRICULUM.md` ("Data wanted
      later") names Open Source Asset Pricing (Chen & Zimmermann) as the public source; it is not in the pipeline.
    scope: |-
      Add the Open Source Asset Pricing (OSAP) predictor data to the data pipeline. Public sources only, no credentials. Set up `.venv` as `docs/DATA.md` describes before `npm run data`. Read first: `docs/DATA.md`, `scripts/data/fetch.py`, `src/lib/data/series.ts`, `src/lib/data/series.test.ts`, and the OSAP data page (https://www.openassetpricing.com/data/) with its signal documentation.

      What the chapter needs:
      - Monthly long–short returns of every signal OSAP classes as a clear predictor, built as in the original papers (OSAP's "original paper" portfolios). One series file, `osap-ls-monthly`: column zero is the date, then one column per signal acronym; cells are `null` before a signal's data start, so every signal column is optional (`required: false`).
      - The same long–short returns under value weighting, `osap-ls-vw-monthly`, and with microcaps excluded (OSAP's NYSE 20th-percentile size screen), `osap-ls-exmicro-monthly`, if OSAP publishes these variants. If one is not published, say so in the outcome and leave it out; do not build it yourself.
      - Signal documentation, `osap-signals`: one record per signal with acronym, authors, publication year, journal, original sample start and end years and OSAP's category. This is not a dated series. Add it as a small JSON file with its own typed loader in `src/lib/data/` and its own test, and document its contract in `docs/DATA.md` next to the series contract.
      Keep OSAP's units (state them: OSAP reports percent per month). Do not compute means, t-statistics or any summary here; the library task does that. Start the series in 1963-01 if a file would otherwise pass 1.5 MB; if it is still over 1.5 MB, report the sizes and keep the original-paper file only.

      Downloads. OSAP serves files from Google Drive and through its Python package `openassetpricing`. Use whichever works without credentials; pin any new Python dependency in `scripts/data/requirements.txt`. Record the exact file names, release (vintage) and retrieval date in `docs/DATA.md`, and add the rows to the sources table with the terms OSAP states. If OSAP states no redistribution licence, follow the goal's assumption for small derived public academic data, as for the French files, and say so. If the download is blocked, stop with `Goal-Blocked` and name the exact files the owner must download.

      Another data task (`data-french-sorts-daily`) may merge first and touch the same files. Rebase on `origin/main` before you finish and keep both sets of entries. Touch only: `scripts/data/fetch.py`, `scripts/data/requirements.txt` if needed, the new JSON files in `src/data/series/`, `src/lib/data/series.ts` (new `seriesColumns` entries), one new loader file for the signal documentation in `src/lib/data/` with its test, `src/lib/data/series.test.ts` and `docs/DATA.md`. If `npm run data` changes any other JSON file, restore it with `git checkout -- <file>` and say so. Out of scope: library maths, chapters and widgets.
    acceptance:
      - '`npm run data` writes the OSAP files, and the outcome states each file''s first and last date (or record count), number of signals and size.'
      - '`npm test` passes, including schema tests, three raw-source cells per series file and a test of the signal documentation loader.'
