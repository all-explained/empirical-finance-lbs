  - ref: lib-skeptical-tests
    title: 'Library: random-factor fits, GLS R², traded-factor restrictions and R² confidence intervals'
    milestone: M-9
    why: >-
      SC-7 and M-9. Chapter 28 shows that almost any factor correlated with SMB and HML fits the 25 size–value
      portfolios, and applies the four fixes of Lewellen, Nagel & Shanken (2010): more test assets, the restriction
      that a traded factor's premium equals its mean, the GLS R², and confidence intervals for R². `src/lib` has the
      two-pass regression and its OLS R², but none of these four pieces.
    scope: |-
      Add `src/lib/finance/skeptical.ts` and `src/lib/finance/skeptical.test.ts`. Read first: the entry of chapter 28 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3, `src/lib/finance/crossSection.ts` (`crossSectionalRegression`, its one R² definition), `src/lib/finance/timeSeriesTests.ts` (`factorPanel`, `timeSeriesRegressions`), `src/lib/finance/factors.ts` (`modelPanel`), `src/lib/finance/identification.ts` (`simulateUselessFactor`, which chapter 27 uses; do not duplicate it), `src/lib/finance/portfolio.ts`, `src/lib/stats/pca.ts` and `src/lib/math/rng.ts`. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/LewellenNagelShanken2010.pdf` (Lewellen, Nagel & Shanken (2010), NBER working-paper version) with `pdftotext -layout` and cite pages in doc comments for anything you take from it: the artificial factors of its Figure 1, Prescriptions 1–4, the GLS R² and its link to mean-variance efficiency, and the bootstrap behind its confidence intervals.

      Functions (decimal excess returns, $T \times N$, and factors, $T \times K$; every function takes plain matrices, so the industry portfolios of the parallel data task need no code here):
      - `randomFactorFit(seed, excess, smb, hml, { samples, factors, noiseShare })`: draw seeded artificial factors that mix SMB, HML and noise, as the paper's Figure 1 does (state the mixing rule and cite its page); for each draw run the two-pass regression with an intercept and return the OLS and GLS cross-sectional R², and their distribution (median and the share above a given level).
      - `glsR2(excess, factors)`: the GLS cross-sectional R² as the paper defines it, with the return covariance $\Sigma$ (divisor $T$) as weight, and its relative mean-variance reading: state in a doc comment which squared Sharpe ratios it compares. Do not change `crossSectionalRegression`.
      - `tradedFactorRestriction(excess, factors)`: for traded factors, the cross-sectional regression with the factors added to the test assets, its slope $\hat\lambda$ next to the factor means $\bar f$, the gap $\hat\lambda - \bar f$ with a standard error, and the zero-beta rate against zero (excess returns), as Prescription 2 asks.
      - `r2ConfidenceInterval(seed, excess, factors, { samples, level, weighting })`: a seeded bootstrap of months for the sample R² (OLS or GLS), following the paper's procedure as far as it states it (cite the page), returning the interval and the bootstrap draws. Keep the default `samples` small enough that the unit tests finish in a few seconds; give long tests an explicit timeout (issue #67).

      Notation. Add any symbol these functions need that §3 lacks (for example $R^2_{\text{GLS}}$) to one "Part VII" block of the `docs/STYLE_GUIDE.md` §3 table, each with the clash it avoids. The other two Part VII library tasks add rows to the same block: whichever merges first creates the block heading; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: `glsR2` is 1 when the factor is the in-sample tangency portfolio of the test assets (`tangencyWeights`), as the paper says it must be; with OLS weighting the R² of the two-pass regression equals `crossSectionalRegression`'s `r2`; in `tradedFactorRestriction`, when the factor is one of the test assets, $\hat\lambda$ matches a hand computation on a three-asset case; `randomFactorFit` with `noiseShare` 1 behaves like a useless factor (state the median R²) and with `noiseShare` near 0 gives a median OLS R² far above the CAPM's on the 25 portfolios (state both); `r2ConfidenceInterval` gives the same output for the same seed and an interval that contains the point estimate; pinned values on the committed `ff25-size-bm-monthly` and `ff3-monthly` data from 1963-07: the OLS and GLS R² of CAPM and FF3, and the 95% interval for the FF3 OLS R². Reuse `timeSeriesRegressions`, `crossSectionalRegression`, `factorPanel`, `modelPanel`, `sampleMeans`, `sampleCovariance`, `tangencyWeights`, `maxSharpeSquared`, `solve`, `inverse` and the RNG helpers; do not copy them. Out of scope: chapters, widgets, and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - '`git status --short` shows only `src/lib/finance/skeptical.ts`, its test, `docs/STYLE_GUIDE.md` (if a symbol was added) and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-multiple-testing
    title: 'Library: Bonferroni, Holm and Benjamini–Hochberg–Yekutieli, and seeded strategy searches'
    milestone: M-9
    why: >-
      SC-7 and M-9. Chapter 29 explains why $t > 2$ is too low a bar after hundreds of tries: it controls the
      family-wise error rate (Bonferroni, Holm) and the false discovery rate (Benjamini–Hochberg–Yekutieli), counts
      true and false discoveries in a seeded search, and applies the rules to the published predictors that chapter
      21 already loads. Nothing in `src/lib` does multiple testing yet.
    scope: |-
      Add `src/lib/stats/multipleTesting.ts` and `src/lib/stats/multipleTesting.test.ts`. Read first: the entry of chapter 29 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the rows for $q$, $\alpha$, $M$ and $N$), `src/lib/math/normal.ts`, `src/lib/stats/moments.ts`, `src/lib/finance/zoo.ts` (`signalSummaries`: one $t$-statistic per published signal and window) and `src/lib/math/rng.ts`. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/HarveyLiuZhu2016.pdf` (Harvey, Liu & Zhu (2016), published version) with `pdftotext -layout` and cite pages in doc comments for each procedure you take from it (Bonferroni, Holm, BHY, and the case for a cut-off near $t = 3$).

      Functions ($p$-values in $[0, 1]$, two-sided unless stated):
      - `pValues(t)`: two-sided normal $p$-values from $t$-statistics, through `cdf` in `normal.ts`.
      - `bonferroni(p, q)`, `holm(p, q)`, `benjaminiHochberg(p, q)` and `benjaminiHochbergYekutieli(p, q)`: for each, the rejected set (a boolean per test, in input order), the number rejected and the implied $t$ cut-off (the smallest $|t|$ that is rejected, or `null`). BHY uses the constant $c(n) = \sum_{j=1}^{n} 1/j$, as the paper gives it.
      - `simulateStrategySearch(seed, { count, trueShare, sharpe, T })`: `count` seeded strategies, a share `trueShare` of them with a true annualised Sharpe ratio `sharpe` and the rest with none, each with $T$ months of i.i.d. normal returns (state the volatility); return each strategy's $t$-statistic and whether its alpha is true.
      - `discoveryCounts(t, isTrue, cutoff)`: true and false discoveries, misses, the false discovery proportion and the expected number of false discoveries under the null, (number of null strategies) × (the test size implied by `cutoff`).

      Notation. §3 says $\alpha$ is never a significance level and $M$ is the SDF; $q$ is already the significance level or false discovery rate, and $p$ is a log price. Choose a symbol for the number of tests and one for a $p$-value (for example $p_i$ with a row that says so, as chapter 27 used $p(\lambda^{\circ})$), check each against §3, and add them to one "Part VII" block of the §3 table, each with the clash it avoids. The other two Part VII library tasks add rows to the same block: whichever merges first creates the block heading; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: `pValues` at $t = 1.96$ gives 0.05 to 1e-4; each procedure on a small hand-made list of $p$-values gives the rejected sets you work out by hand (Holm rejects at least as many as Bonferroni; BH at least as many as Holm; BHY no more than BH); `benjaminiHochbergYekutieli` with $n = 1$ equals a single test at level $q$; `simulateStrategySearch` gives the same output for the same seed, and with `trueShare` 0 the share of $|t| > 1.96$ is within simulation error of 5% (state the band); and pinned values on the committed `osap-ls-monthly` data: for the original-sample $t$-statistics of `signalSummaries`, the number of signals, and the number that survive $|t| > 1.96$, $|t| > 3$, Bonferroni, Holm and BHY at $q = 0.05$. Reuse `cdf`, `invCdf`, `signalSummaries` and the RNG helpers; do not copy them. Out of scope: chapters, widgets, and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - '`docs/STYLE_GUIDE.md` §3 has a Part VII block with the symbols for the number of tests and a $p$-value, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/stats/multipleTesting.ts`, its test, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-shrinkage
    title: 'Library: shrinkage SDF estimates, the elastic net and cross-validated R²'
    milestone: M-9
    why: >-
      SC-7 and M-9. Chapter 30 estimates SDF coefficients for many factors at once, as Kozak, Nagel & Santosh (2020)
      do: a natural prior turns the estimate into a ridge regression, the elastic net adds sparsity, and a few
      principal components carry most of the SDF. It needs the estimators, their cross-validated out-of-sample R², and
      in-sample and out-of-sample Sharpe ratios of the shrunk tangency portfolio. Nothing in `src/lib` shrinks yet.
    scope: |-
      Add `src/lib/finance/shrinkage.ts` and `src/lib/finance/shrinkage.test.ts`. Read first: the entry of chapter 30 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (with the Part VI block), `docs/DATA.md`, `src/lib/finance/portfolio.ts` (`tangencyWeights`, `maxSharpeSquared`, `sampleMeans`, `sampleCovariance`), `src/lib/finance/factors.ts` (`modelPanel`), `src/lib/finance/sdfGmm.ts` (the SDF form $M_{t+1} = 1 - b'\tilde f_{t+1}$), `src/lib/stats/pca.ts`, `src/lib/math/linalg.ts` (`symmetricEigen`, `solve`) and `src/lib/finance/zoo.ts` (how `osap-ls-monthly` is read). Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/KozakNagelSantosh2018.pdf` (Kozak, Nagel & Santosh (2020), published version; the file name says 2018) with `pdftotext -layout` and cite pages in doc comments for the prior, the ridge form, the elastic-net objective, the PC rotation, the K-fold cross-validation and the out-of-sample R² you implement.

      Functions (decimal excess returns of the base assets, $T \times N$):
      - `assetPanel(set, series)` for two asset sets: `'ff'`, the 25 size–value portfolios with the FF5 factors and momentum as traded assets (from `ff25-size-bm-monthly`, `ff5-monthly` and `mom-monthly`, 1963-07 on, through `modelPanel` where it fits), and `'osap'`, the published long–short predictors of `osap-ls-monthly` with no missing month over a common window chosen so that at least 40 signals remain (state the window and the count). Apply the preprocessing the paper states (for example removing the market and rescaling), citing each step's page, and return dates, names and returns.
      - `ridgeSdf(mu, Sigma, penalty)`: $\hat b = (\Sigma + \gamma I)^{-1}\bar\mu$ in the curriculum's letters, and the map from the paper's prior scale (the expected maximum squared Sharpe ratio) to the penalty, as the paper gives it.
      - `elasticNetSdf(mu, Sigma, { l1, l2 })`: the paper's penalised objective with the $L^1$ and $L^2$ penalties, by coordinate descent to a tolerance with an iteration cap; return $\hat b$ and the number of non-zero coefficients.
      - `principalComponentAssets(returns)`: the returns rotated onto their principal components (reuse `pca`), so both estimators can run on PCs as well as on the original assets.
      - `crossValidatedR2(returns, { folds, penalty, l1, space })`: K-fold cross-validation over contiguous blocks of months (state $K$; the paper's choice is the default), with the out-of-sample cross-sectional R² the paper defines (cite it), averaged over folds.
      - `shrinkagePath(returns, { penalties, l1, space })`: $\hat b$ for each penalty on a grid and the cross-validated R² curve, for the `ShrinkagePath` widget.
      - `splitSampleSharpe(returns, { split, penalty })`: the shrunk tangency portfolio $w \propto \hat b$ estimated on the first part of the sample, with its in-sample and out-of-sample Sharpe ratios and mean–volatility points, for the `FrontierBuilder` preset; with penalty 0 it is the plain tangency portfolio.

      Notation. The curriculum writes $m_t$, $F_t$, $\gamma$, $\kappa$ and $\tau$; §3 uses $M$ for the SDF and $f_t$ for factors, and $\gamma$ (risk aversion), $\kappa$ (Campbell–Shiller constant), $\tau$ (option life) and $F_t$ (forward price) are taken. Choose free letters for the penalties, the prior scale and the cross-validated R² (§3's $R^2_{OS}$ is the forecast R² of chapter 13, a different object), check each against §3, and add them to one "Part VII" block of the §3 table, each with the clash it avoids; if the curriculum's letter is taken, keep it out of the code names too. The other two Part VII library tasks add rows to the same block: whichever merges first creates the block heading; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: `ridgeSdf` with penalty 0 equals $\Sigma^{-1}\bar\mu$ and the `tangencyWeights` direction; `elasticNetSdf` with no $L^1$ penalty equals `ridgeSdf` to 1e-8, with a large $L^1$ penalty returns all zeros, and its solution meets the optimality (KKT) conditions on a seeded case; `principalComponentAssets` preserves total variance; on PCs, the ridge estimate shrinks each PC coefficient by the factor the paper derives (state it); `crossValidatedR2` gives the same output on repeated calls and a hand-checked value on a small seeded panel; `splitSampleSharpe` with penalty 0 gives the in-sample maximum Sharpe ratio `maxSharpeSquared`; and pinned values on the committed data: for both asset sets, the sample window, the number of assets, the penalty that maximises the cross-validated R² and that R², and the in-sample and out-of-sample Sharpe ratios at penalty 0 and at that penalty. Keep the default grids small enough that the unit tests finish in a few seconds; give long tests an explicit timeout (issue #67). Reuse `pca`, `symmetricEigen`, `solve`, `sampleMeans`, `sampleCovariance`, `tangencyWeights`, `maxSharpeSquared`, `modelPanel` and the series loaders; do not copy them. Out of scope: chapters, widgets, and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - '`docs/STYLE_GUIDE.md` §3 has a Part VII block with the shrinkage symbols, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/shrinkage.ts`, its test, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
