task: TASK-038
add:
  - ref: lib-habit
    title: 'Library: the Campbell–Cochrane habit model, its price–consumption ratio and Gauss–Hermite quadrature'
    milestone: M-12
    why: >-
      SC-7 and M-12. Chapter 37 builds the Campbell–Cochrane model: a slow-moving external habit, the surplus
      consumption ratio, a sensitivity function that keeps the risk-free rate constant, and a price–consumption ratio
      that falls when the surplus is low, so that returns become predictable. `src/lib/finance/sdf.ts` and
      `consumptionPuzzle.ts` price only power utility, and nothing in `src/lib` solves a model on a grid or takes an
      expectation over a normal shock by quadrature. The maths needs no dataset, so this task starts at once.
    scope: |-
      Add `src/lib/finance/habit.ts`, `src/lib/math/quadrature.ts` and a test file for each. Read first: the entry of chapter 37 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the SDF and consumption table, the predictability table where $\phi$ is AR(1) persistence, the Part IX block and the Probability and statistics table), `src/lib/finance/consumptionPuzzle.ts` (`impliedRiskFree`, `crraSdfMoments`), `src/lib/finance/sdf.ts`, `src/lib/finance/predictive.ts` (`predictiveRegression`, `horizonSlopes`), `src/lib/stats/var.ts`, `src/lib/math/rootFind.ts` and `src/lib/math/rng.ts`.

      Readings. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/CampbellCochrane1999.pdf` (Campbell & Cochrane, author manuscript dated May 1998; cite the 1999 *Journal of Political Economy* article and name manuscript pdf pages). Its fonts are scrambled, so `pdftotext` prints nonsense: render a page with `pdftoppm -png -r 150 -f N -l N` and read the image, or run `tesseract` on it. Cite pages in doc comments for anything you take from it: preferences, eq. (1), pdf p. 4; the surplus consumption ratio and its law of motion, eqs. (2)–(3), and i.i.d. consumption growth, eq. (4), p. 5; marginal utility and the SDF, eq. (5), p. 6; the risk-free rate, eq. (8), p. 7; the sensitivity function, the steady state and the upper bound on the surplus, eqs. (9)–(12), p. 8, with the conditions behind them on p. 9; the prices of long-lived assets, solved numerically on a grid, p. 11; the parameter choices, Section II.E, p. 12, and Table 1, p. 13; internal habit formation, Section IV.C, p. 37. Campbell (2018), Ch. 6, is not in `source/papers/` (see `docs/READINGS.md`): take no fact from it. Constantinides (1990) and Abel (1990) are not in `source/papers/` either: name them only where Campbell & Cochrane do, with their page.

      Functions (decimal log rates per period; one period is a month unless an option says otherwise, as in Campbell & Cochrane's simulations; state the conversion from their annual Table 1 values in a doc comment):
      - `quadrature.ts`: `gaussHermite(n)`, the nodes and weights of $n$-point Gauss–Hermite quadrature, and `normalExpectation(f, n)`, $\mathbb{E}[f(Z)]$ for $Z \sim N(0, 1)$. Generic maths; no finance in this file.
      - `campbellCochraneParameters`: Table 1 of the paper (mean and volatility of consumption growth, the risk-free rate, $\phi$, $\gamma$ and the implied $\delta$), each value with its page.
      - `steadyStateSurplus(params)` and `maxSurplus(params)`: $\bar S$ and $s_{\max}$ of eqs. (9) and (11).
      - `sensitivity(s, params)`: eq. (10), zero above $s_{\max}$.
      - `habitRiskFree(params)`: the constant log risk-free rate of eq. (12); `localCurvature(surplus, gamma)`: $\gamma/S_t$.
      - `habitLogSdf(s, sNext, dc, params)`: $\log M_{t+1}$ from eq. (5).
      - `simulateHabit(seed, params, options)`: a seeded path of $\Delta c_t$, $s_t$ (starting at $\bar s$), $S_t$, the habit $X_t$ and $\log M_t$.
      - `priceConsumptionRatio(params, options)`: the price–consumption ratio of a claim to consumption as a function of $s$ on a grid, by the series of zero-coupon claims, $F_0(s) = 1$, $F_n(s) = \mathbb{E}[M_{t+1}e^{\Delta c_{t+1}}F_{n-1}(s_{t+1}) \mid s_t = s]$, $P/C(s) = \sum_{n \ge 1} F_n(s)$, with `normalExpectation` over the shock and linear interpolation in $s$; state the grid, the stopping rule and the time one solve takes on the test machine, which must stay low enough for a widget slider (say what you measured). Return the grid, the values and an evaluator.
      - `habitClaimReturns(path, solution)`: the log price–consumption ratio and the log return and excess return of the consumption claim along a simulated path, time-aggregated to years as an option, so a chapter can run predictive regressions on model data with `predictiveRegression` and `horizonSlopes` (reuse them in the tests; do not copy them).
      - `habitMarginalUtility(path, options)`: marginal utility under an external habit and under an internal habit, both with the simple habit $X_t = hC_{t-1}$, on a given consumption path; the internal one subtracts the effect of today's consumption on tomorrow's habit, $\delta h\,\mathbb{E}_t[(C_{t+1} - hC_t)^{-\gamma}]$, taken by `normalExpectation` under i.i.d. lognormal growth. Derive both in a doc comment and cite p. 37 for the comparison.

      Notation. §3 gives $\lambda$ to risk premia, $g$ to the GMM moment function and $s$ to a share in Chapter 28. Choose the symbol for the sensitivity function (for example $\Lambda(s_t)$), write the mean and volatility of consumption growth as the Part IX $\mu_c$ and $\sigma_c$, keep $\phi$ for the persistence of $s_t$ only if it reads as the AR(1) persistence of §3 (it is), and give $S_t$, $s_t$, $\bar s$, $s_{\max}$, $X_t$ and $h$ rows. Add each to one "Part X" block of the §3 table, with the clash it avoids. The other two Part X library tasks add rows to the same block: whichever merges first creates the block heading; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: `gaussHermite` integrates polynomials up to degree $2n - 1$ exactly and gives $\mathbb{E}[e^{aZ}] = e^{a^2/2}$ to 1e-10; $\bar S$, $s_{\max}$ and the risk-free rate on `campbellCochraneParameters` match a hand computation and the values Table 1 reports (name the page); at every grid point $\mathbb{E}[M_{t+1}]e^{r^f} = 1$ to 1e-10 by quadrature, which checks eq. (12); with the habit switched off (an option that sets $S_t \equiv 1$) `priceConsumptionRatio` equals the closed-form power-utility value to 1e-8; the price–consumption ratio rises with $s$; its mean on a long seeded path lies within a stated band of the paper's simulated mean (name the table and page); the slope of long-horizon excess returns on the log price–consumption ratio in a long seeded simulation is negative and grows with the horizon, as Table 5 (p. 23) reports; `habitMarginalUtility` with $h = 0$ is power-utility marginal utility; and the same seed gives the same path. Reuse the RNG helpers of `src/lib/math/rng.ts`, `predictiveRegression` and `horizonSlopes`; do not copy them. Out of scope: chapters, widgets, data loading and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - 'The outcome states the grid, the stopping rule and the measured time of one `priceConsumptionRatio` solve.'
      - '`docs/STYLE_GUIDE.md` §3 has a Part X block with the habit symbols, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/habit.ts`, `src/lib/math/quadrature.ts`, their tests, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-long-run-risk
    title: 'Library: Epstein–Zin pricing, the long-run risks solution, simulation and variance ratios'
    milestone: M-12
    why: >-
      SC-7 and M-12. Chapter 38 separates risk aversion from the elasticity of intertemporal substitution, shows how a
      small persistent part of consumption growth makes stocks risky, and weighs the evidence. It needs the Epstein–Zin
      SDF, the approximate analytical solution of the long-run risks model with its endogenous linearisation
      constants, a seeded simulation with and without the persistent part, long-horizon variance ratios, and the
      predictive regressions Beeler and Campbell use against the model. `presentValue.ts` has the Campbell–Shiller
      constants and `predictive.ts` the horizon regressions; nothing solves the model. No dataset is missing, so this
      task starts at once.
    scope: |-
      Add `src/lib/finance/longRunRisk.ts` and `src/lib/finance/longRunRisk.test.ts`. Read first: the entry of chapter 38 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the SDF and consumption table with $\psi$, the predictability table with $\phi$, $\rho$ and $\kappa$, the Part VII row for $\nu_1$, $\nu_2$, the Part IX block and the Probability and statistics table with $\theta$), `src/lib/finance/presentValue.ts` (`linearisationConstants`, `goyalWelchAnnualPresentValue`), `src/lib/finance/predictive.ts` (`predictiveRegression`, `horizonSlopes`), `src/lib/finance/consumptionPuzzle.ts` (`annualConsumption`, `annualSample`, `impliedRiskFree`), `src/lib/stats/autocorr.ts` (`overlapMeanVariance`), `src/lib/stats/var.ts`, `src/lib/math/rootFind.ts` and `src/lib/math/rng.ts`.

      Readings. Open these PDFs with `pdftotext -layout` and cite pages in doc comments for anything you take from them:
      - `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/BansalKikuYaron2012.pdf` (Bansal, Kiku & Yaron, NBER working paper dated November 2009; cite the 2012 *Critical Finance Review* article and name working-paper pdf pages): preferences, eq. (1), and the joint dynamics of consumption, the persistent part, volatility and dividends, eq. (3), p. 6; the log SDF, eq. (5), and the log-linear return on wealth, eq. (6), p. 7; the solution $z_t = A_0 + A_1x_t + A_2\sigma_t^2$ with the endogenous mean $\bar z$, eqs. (7)–(9), p. 8; the risk premium, eq. (10), and the prices of risk, eq. (11), p. 9; the market return betas and the dividend claim, Appendix, from p. 23; the monthly calibration, Table I, p. 28.
      - `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/BeelerCampbell2012.pdf` (Beeler & Campbell, NBER working paper dated March 2009; cite the 2012 *Critical Finance Review* article and name working-paper pdf pages): the BY and BKY calibrations, pp. 6–7 and Table I, p. 34; solving and simulating the model, Section 2.1, p. 7; the analytical moments of both calibrations, Tables II–III, pp. 35–36; autocorrelations of consumption and dividend growth, Table IV, pp. 37–38; predictive regressions on the log price–dividend ratio, Table VI, pp. 41–42; the annual US data, 1930–2006, Section 3, p. 9.
      Bansal & Yaron (2004) and Epstein & Zin (1989) are not in `source/papers/`: name them only where an opened reading does, with its page. Campbell (2018), Ch. 6, is not in `source/papers/` either: take no fact from it.

      Functions (decimal log rates; monthly steps as in the papers' calibrations, with annual figures from an option):
      - `bkyParameters` and `byParameters`: the two calibrations of Beeler & Campbell's Table I (check BKY against Bansal, Kiku & Yaron's Table I), each value with its page.
      - `epsteinZinTheta(gamma, psi)`: $\theta = (1 - \gamma)/(1 - 1/\psi)$, with the limit at $\psi = 1$ handled or refused (say which).
      - `solveLongRunRisk(params)`: $A_0$, $A_1$, $A_2$ for the consumption claim with $\bar z$ from the fixed point of eq. (8) and $\kappa_0$, $\kappa_1$ from $\bar z$; the same for the dividend claim (Appendix); the prices of risk of eq. (11); the market betas; the risk-free rate; and the equity premium of eq. (10), monthly and annualised, at $\sigma_t^2 = \bar\sigma^2$. Solve the fixed points with `rootFind.ts` and report the residual.
      - `simulateLongRunRisk(seed, params, options)`: a seeded monthly path of $x_t$, $\sigma_t^2$ (keep it positive and state how, citing Beeler & Campbell's page for their choice), $\Delta c_t$, $\Delta d_t$, the log price–consumption and price–dividend ratios, the market return and the risk-free rate; an option that switches the persistent part off ($x_t \equiv 0$) with the same shocks, so a widget can show consumption with and without it.
      - `annualise(monthlyPath)`: annual consumption and dividend growth and annual returns from the monthly path, aggregated as Beeler & Campbell do (monthly levels summed to yearly levels, then growth, then logs; Table II note, p. 35), so model output and annual data are compared alike.
      - `varianceRatio(x, horizon)`: the variance of $k$-period sums over $k$ times the one-period variance, for any series; add it to `src/lib/stats/autocorr.ts` with its test, unless `overlapMeanVariance` already gives it, in which case reuse that. `lrrVarianceRatio(params, horizon)`: the exact ratio for $\Delta c$ implied by the AR(1) persistent part at constant volatility, derived in a doc comment.
      - `consumptionPredictability(dc, pd, horizons)`: slopes, $t$-statistics and $R^2$ of $k$-year consumption growth on the log price–dividend ratio, as in Beeler & Campbell's Table VI, through `horizonSlopes`; a helper that builds the inputs from `annualConsumption` and `goyalWelchAnnualPresentValue` over the common years (state them).

      Notation. §3 gives $\theta$ to the GMM parameter vector, $\rho$ and $\kappa$ to the Campbell–Shiller constants, $\phi$ to AR(1) persistence, $\nu_1$, $\nu_2$ to shrinkage penalties and $\lambda$ to risk premia. Write the papers' $\kappa_1$ and $\kappa_0$ as the §3 $\rho$ and $\kappa$ with a subscript for the claim, because they are the same constants. Then choose symbols for the Epstein–Zin $\theta$ (for example $\theta_{\text{EZ}}$), the persistence of $x_t$ (for example $\phi_x$), the persistence of volatility, the loading of $x_t$ on its shock, the dividend leverage, and the prices of risk; give $x_t$, $\bar\sigma$ and $\sigma_w$ rows. Add each to the "Part X" block of the §3 table, with the clash it avoids and the papers' symbol. The other two Part X library tasks add rows to the same block: whichever merges first creates the block heading; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: `epsteinZinTheta` is 1 when $\gamma = 1/\psi$; with $\gamma = 1/\psi$, no persistent part and constant volatility, the prices of long-run and volatility risk are 0 and the risk-free rate equals `impliedRiskFree` to 1e-10; $A_1 = (1 - 1/\psi)/(1 - \kappa_1\phi_x)$ and the fixed-point residual is below 1e-12; on both calibrations, the mean and volatility of annual consumption growth, the mean excess return, the mean risk-free rate and the mean log price–dividend ratio of a long seeded simulation, put through `annualise`, match the BY and BKY columns of Beeler & Campbell's Table II (p. 35, itself from a 1.2-million-month simulation) within a stated tolerance; $\mathbb{E}[M_{t+1}e^{r_{t+1}}] = 1$ for the market and the risk-free asset within a stated band on a long seeded path; `varianceRatio` of seeded white noise lies within a stated band of 1 and of the model's `lrrVarianceRatio` on a long seeded path; and pinned values on the committed data for `consumptionPredictability` at 1, 3 and 5 years. Reuse `linearisationConstants`, `horizonSlopes`, `predictiveRegression`, `impliedRiskFree` and the RNG helpers; do not copy them. Out of scope: chapters, widgets, and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - 'The outcome compares the library''s moments with Beeler & Campbell''s Table II (p. 35) for both calibrations.'
      - '`docs/STYLE_GUIDE.md` §3 has a Part X block with the long-run risks symbols, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/longRunRisk.ts`, its test, `src/lib/stats/autocorr.ts` and its test if `varianceRatio` was added there, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-disasters
    title: 'Library: rare-disaster pricing, seeded disaster centuries and the relative entropy estimator'
    milestone: M-12
    why: >-
      SC-7 and M-12. Chapter 39 shows how a small chance of a large consumption drop can price the equity premium,
      and then, following Julliard & Ghosh (2012), asks how much disaster risk the data need without assuming its
      size: it reweights the sample's years so that the Euler equation holds, as close as possible to equal weights.
      `consumptionPuzzle.ts` prices lognormal power utility and builds the annual sample, but nothing adds a disaster
      state or solves the entropy problem. No dataset is missing (see the plan outcome), so this task starts at once.
    scope: |-
      Add `src/lib/finance/disasters.ts` and `src/lib/finance/disasters.test.ts`. Read first: the entry of chapter 39 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the SDF and consumption table, the Part IX block, and the Probability and statistics table, which writes probabilities as $\pi$ and keeps $p$ for log prices), `src/lib/finance/consumptionPuzzle.ts` (`annualConsumption`, `annualSample`, `puzzleMoments`, `impliedRiskFree`, `crraSdfMoments`), `src/lib/finance/sdf.ts`, `src/lib/math/rootFind.ts`, `src/lib/math/optimize.ts`, `src/lib/math/distributions.ts` (`chiSquareSurvival`) and `src/lib/math/rng.ts`.

      Readings. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/JulliardGhosh2012.pdf` (working paper; the published author order is Julliard and Ghosh, which the curriculum reverses: cite Julliard & Ghosh (2012), *Review of Financial Studies*, and name working-paper pdf pages) with `pdftotext -layout`, and cite pages in doc comments for anything you take from it: why sample frequencies mislead when rare events are under-represented, p. 5; the empirical likelihood estimator, eq. (3), and its relative entropy reading, eq. (4), p. 6; the exponentially tilted weights, eqs. (5)–(6), p. 7; the dual problem, Appendix A.1.2, p. 32; the calibration method, Section 1.2, p. 8; the annual US data from 1929, p. 8; the US estimates, pp. 10–12 and Table 1, p. 37. Rietz (1988) and Barro (2006) are not in `source/papers/`: name them only where Julliard & Ghosh do (for example p. 2), with their page, and take a number from them only as Julliard & Ghosh report it, with that page. Campbell (2018), Ch. 6, is not in `source/papers/`: take no fact from it.

      Functions (decimal log rates per year):
      - `disasterPricing(params)`: power utility with i.i.d. lognormal consumption growth plus, with probability $\pi_D$ each year, a drop of a fraction $b_D$ of consumption (the symbols are placeholders; see Notation). Closed forms for $\mathbb{E}[M]$, the log risk-free rate, and the expected excess return of a claim whose disaster loss is an option (equal to $b_D$ for the consumption claim), split into its normal-times part and its disaster part, which carries the term $\pi_D(1 - b_D)^{-\gamma}$ of the curriculum. Derive them in a doc comment from $\mathbb{E}[M R^e] = 0$.
      - `requiredDisasterProbability(target, params)`: the $\pi_D$ that matches a target premium at given $b_D$ and $\gamma$, with `bisection`; `null` when no probability in $[0, 1)$ does.
      - `simulateDisasterCentury(seed, params, years)`: seeded annual consumption growth and excess returns with rare drops, the number of disasters drawn, and the sample premium, so a widget can show that many centuries contain no disaster.
      - `eulerMoments(sample, gamma)`: $g_t(\gamma) = e^{-\gamma\Delta c_t}R^e_t$ from the excess returns of a `ConsumptionSample` (gross excess return $e^{r_t} - e^{r^f_t}$; state it).
      - `entropyWeights(g)`: the weights $\pi_t$ that minimise the relative entropy $\sum_t \pi_t\log(T\pi_t)$ subject to $\sum_t \pi_t = 1$ and $\sum_t \pi_t g_t = 0$, through the convex dual (the weights are proportional to $e^{\ell g_t}$ with $\ell$ minimising $\sum_t e^{\ell g_t}$), solved with `newton`; the entropy and the multiplier; `null` when every $g_t$ has the same sign, so no weights exist.
      - `empiricalLikelihoodWeights(g)`: the weights of eq. (3), $\pi_t = 1/(T(1 + \ell g_t))$ with $\ell$ from its dual, the log-likelihood and the likelihood-ratio statistic of p. 7 with its $\chi^2(1)$ $p$-value from `chiSquareSurvival`.
      - `entropyProfile(sample, gammas)`: for each $\gamma$, the entropy, the statistic, the weights and the weight on the years with the largest consumption falls; the $\gamma$ that minimises each criterion.

      Notation. §3 keeps $p$ for log prices and writes probabilities as $\pi$; $b$ is the SDF loading and $\lambda$ a risk premium. Choose the symbols for the disaster probability (for example $\pi_D$), the disaster size (for example $b_D$, always with its subscript) and the dual multiplier (for example $\ell$), and write the entropy weights as $\pi_t$ in the \Prob colour, as §3 does for $\pi(s)$. Add each to the "Part X" block of the §3 table, with the clash it avoids. The other two Part X library tasks add rows to the same block: whichever merges first creates the block heading; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: with $\pi_D = 0$ `disasterPricing` gives the lognormal results of `impliedRiskFree` and `crraSdfMoments` to 1e-12; its closed forms match the means of many seeded draws within a stated band; `requiredDisasterProbability` inverts `disasterPricing` to 1e-10; `entropyWeights` and `empiricalLikelihoodWeights` sum to 1 and satisfy $\sum_t \pi_t g_t = 0$ to 1e-12, give equal weights and zero entropy when the mean of $g$ is 0, match a brute-force `minimize` on a five-point example, and return `null` for one-signed $g$; the statistic of an exact moment is 0; and pinned values on the committed annual data (1930–2025, the default timing of `annualSample`): the entropy-minimising and likelihood-maximising $\gamma$, the entropy at $\gamma = 10$, and the weights of the years 1930–1933. Reuse `annualSample`, `impliedRiskFree`, `crraSdfMoments`, `bisection`, `newton`, `minimize`, `chiSquareSurvival` and the RNG helpers; do not copy them. Out of scope: chapters, widgets, and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - 'The outcome compares the library''s estimates on our annual sample with Julliard & Ghosh''s Table 1 (p. 37), and says why they differ (sample years, consumption measure, returns).'
      - '`docs/STYLE_GUIDE.md` §3 has a Part X block with the disaster and entropy symbols, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/disasters.ts`, its test, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: chapter-37
    title: 'Chapter 37: Internal and external habits'
    milestone: M-12
    after: [lib-habit]
    why: >-
      SC-7 and M-12. Part X opens with the first answer to the puzzles of Part IX: habits. A slow-moving external
      habit makes risk aversion high when consumption is close to it, which raises the equity premium, keeps the
      risk-free rate low and makes returns predictable. This chapter follows the pattern of the Part I to Part IX
      chapters.
    scope: |-
      Write chapter 37 of `docs/CURRICULUM.md`, "Internal and external habits", as `src/content/chapters/37-internal-and-external-habits.mdx`, with its widgets. Read first: the chapter's entry in `docs/CURRICULUM.md`, all of `docs/STYLE_GUIDE.md` (with the Part IX and Part X blocks of §3), `docs/DATA.md`, the finished chapters `src/content/chapters/09-time-varying-expected-returns.mdx` (`PredictiveRegression`), `src/content/chapters/35-equity-premium-and-risk-free-rate-puzzles.mdx` (`PuzzleCalculator`, the numbers this chapter answers) and `src/content/chapters/05-persistence-ar1-and-var.mdx` (`AR1Simulator`), and the code named below: `src/lib/finance/habit.ts` and `src/lib/math/quadrature.ts` (from the library task this task depends on), `src/lib/finance/predictive.ts`, `src/components/plots/PredictiveRegression.tsx`, `src/components/plots/predictiveSample.ts` and `src/components/plots/puzzleSample.ts`.

      Readings. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/CampbellCochrane1999.pdf` (author manuscript dated May 1998; cite the 1999 *Journal of Political Economy* article and name manuscript pdf pages). Its fonts are scrambled: render pages with `pdftoppm -png -r 150 -f N -l N` and read the images, or run `tesseract` on them. Name the page for any number or fact you take from it; the library's doc comments list the pages of the model, Table 1 (p. 13), the simulated moments (Table 2, p. 20), the long-horizon regressions (Table 5, p. 23) and internal habits (p. 37). Constantinides (1990) and Abel (1990) are not in `source/papers/`: name them only where Campbell & Cochrane do, with their page. Campbell (2018), Ch. 6, is not in `source/papers/`: list it under further reading in the short form and take no fact from it. Cite readings in the short form. Explain ideas in your own words; never copy text, figures or tables, and never copy from the LBS outline. State no fact or number as taken from a reading you have not opened. A number in the prose that comes from our data or simulations is read from library output, never from a paper.

      Data. Seeded simulations from `simulateHabit`, `priceConsumptionRatio` and `habitClaimReturns`, and `goyal-welch-annual` for the data side of the predictive regression (the dividend–price data of chapter 9, through `usePredictiveSample` of `predictiveSample.ts`). Load through one hook in `src/components/plots/habitSample.ts` built on the existing hooks; write no new loading code that an existing hook already covers. The curriculum's data line names `shiller-monthly`; report in the outcome that the chapter uses chapter 9's `goyal-welch-annual` dividend–price data instead, so the model and the data sit in the same widget.

      Chapter:
