  - ref: data-consumption-annual
    title: 'Data: annual real consumption and population from NIPA, 1929 on'
    milestone: M-11
    why: >-
      SC-4, SC-7 and M-11. Chapter 35 puts numbers on the consumption CAPM over the long annual sample that the
      equity premium puzzle is usually stated on, and chapter 36 follows Kroencke (2017), who works with annual NIPA
      consumption from the late 1920s. The pipeline has no annual consumption. `fred-consumption-quarterly` starts in
      2007-Q1 (78 quarters, COVID included), and `fred-cay-quarterly` starts in 1951-Q4. FRED publishes the annual
      NIPA series from 1929 with no API key.
    scope: |-
      Add one dataset to the data pipeline, from FRED, with no credentials. Set up `.venv` as `docs/DATA.md` describes before `npm run data`. Read first: `docs/DATA.md` (file contract, the `fred-consumption-quarterly` and `fred-cay-quarterly` notes), `scripts/data/fetch.py` (its FRED helpers and the FRED entries in `build_all`), `src/lib/data/series.ts` and `src/lib/data/series.test.ts`.

      Dataset: `fred-consumption-annual`, from the FRED public CSV `https://fred.stlouisfed.org/graph/fredgraph.csv?id=PCNDA,PCESVA,DNDGRG3A086NBEA,DSERRG3A086NBEA,B230RC0A052NBEA`: nominal nondurable goods (`PCNDA`) and services (`PCESVA`) expenditure, billions of USD; their chain-type price indexes (`DNDGRG3A086NBEA`, `DSERRG3A086NBEA`, 2017=100); total population (`B230RC0A052NBEA`, thousands of persons, including Armed Forces overseas). Annual, from 1929, keeping the years with all five fields. Keep source units; no deflating, per-person scaling or logs (the library does that, as `cayInputs` does for `fred-cay-quarterly`). These are the annual counterparts of five `fred-cay-quarterly` columns, so a reader can deflate each component by its own index in the same way. Check each ID and unit against the CSV header and the FRED series page before you use it; if FRED has renamed or discontinued one, use the current series for the same NIPA line and record the swap, as the cay notes do.

      Docs. In `docs/DATA.md`, add the row to the sources table (BEA and FRED terms and citation, as for `fred-consumption-quarterly`), update the dataset count in the opening lines and in "A normal run ... rewrites all ... outputs", and add a bullet under "File contract and transformations" that states the units, that annual NIPA values are averages over the year (not end-of-year levels; chapter 36 depends on this), and that chained-dollar components are not additive. In `docs/CURRICULUM.md`, add `fred-consumption-annual` to the **Data:** lines of chapters 35 and 36; change nothing else there.

      Touch only: `scripts/data/fetch.py`, the new JSON file in `src/data/series/`, `src/lib/data/series.ts` (one new `seriesColumns` entry), `src/lib/data/series.test.ts` (schema test and three raw-source cells, as for the others), `docs/DATA.md` and `docs/CURRICULUM.md`. `npm run data` rebuilds every dataset; if it changes any other JSON file, restore it with `git checkout -- <file>` and say so in the outcome. The JSON file stays under 100 KB. Out of scope: library maths, chapters and widgets. If the download is blocked, stop with `Goal-Blocked` and name the exact file the owner must download.
    acceptance:
      - '`npm run data` writes `src/data/series/fred-consumption-annual.json`, and the outcome states its first and last date, row count and size.'
      - '`npm test` passes, including the new schema and raw-cell tests.'
      - '`npm run build` passes.'
      - '`git status --short` shows only the files named above and this task''s outcome file.'
    verify: |-
      npm ci
      npm run data
      git status --short
      npm test
      npm run build
      du -k src/data/series/fred-consumption-annual.json
  - ref: lib-consumption-puzzle
    title: 'Library: consumption samples, lognormal consumption-CAPM pricing and the puzzle numbers'
    milestone: M-11
    after: [data-consumption-annual]
    why: >-
      SC-7 and M-11. Chapter 35 measures consumption growth and market returns, and asks what risk aversion the
      power-utility SDF needs to price the equity premium, what risk-free rate that risk aversion implies, and how the
      model's Hansen–Jagannathan ratio grows with risk aversion. `src/lib/finance/sdf.ts` prices on finite states and
      has the HJ bound, and `cayInputs` builds quarterly log real consumption per person, but nothing gives the
      lognormal closed forms or the annual sample. Chapter 36 reuses the samples and the implied risk aversion.
    scope: |-
      Add `src/lib/finance/consumptionPuzzle.ts` and `src/lib/finance/consumptionPuzzle.test.ts`. Read first: the entries of chapters 35 and 36 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the SDF and consumption table, and the Part VI to Part VIII blocks), `docs/DATA.md` (consumption, cay inputs and Goyal–Welch notes), `src/lib/finance/sdf.ts` (`crraSdf`, `hjBoundSharpe`), `src/lib/finance/cay.ts` (`cayInputs`, `quarterlyExcessReturns`), `src/lib/finance/conditional.ts` (`quarterlyPanel`, the consumption growth chapters 22, 26 and 33 use), `src/lib/stats/moments.ts`, `src/lib/data/series.ts` and `src/components/plots/sdfSamples.ts` (the assumed consumption moments of chapter 8's `HJBound`, which this library replaces with measured ones).

      Readings. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/Ludvigson2013.pdf` (Ludvigson (2013), working paper of January 2012; the puzzle and the Euler-equation errors are on pdf pages 12–22) and `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/Campbell2014.pdf` (Campbell (2014), working paper; the puzzle is on pdf page 10) with `pdftotext -layout`, and cite pages in doc comments for anything you take from them. The curriculum's readings Campbell (2018) and Cochrane (2005) are not in `source/papers/` (see `docs/READINGS.md`): take no fact from them. The lognormal formulas are textbook algebra; derive them in a doc comment from $\mathbb{E}_t[M_{t+1}(1 + R_{t+1})] = 1$ and cite no reading for them.

      Samples (decimal log real rates per period):
      - `annualConsumption(series)`: log real nondurables and services per person from `fred-consumption-annual`, built as `cayInputs` builds $c_t$ (each component deflated by its own price index, then added; per person), and its growth $\Delta c_t$.
      - `annualSample(consumption, goyalWelchAnnual, options)`: year-by-year $\Delta c$, the log real market return $\log(1 + \text{CRSP\_SPvw}) - \log(1 + \text{infl})$, the log real risk-free rate from `Rfree` and `infl`, and the log excess return, over the common years (1930 to 2025 by default; an option for the start year, so the chapter can show the postwar sample). Annual NIPA consumption is a yearly average, so the timing of returns against consumption matters: support the two conventions the literature uses (the return of year $t$ against $\Delta c_t$, and against $\Delta c_{t+1}$), state which is the default and why in a doc comment, and test both.
      - `quarterlySample(cayQuarterly, goyalWelchMonthly)`: the same four series by quarter from 1952-Q1, reusing `cayInputs` and `quarterlyExcessReturns` (add the real risk-free rate from the monthly `Rfree` and `infl` in the same way); do not repeat their code.
      - `puzzleMoments(sample, periodsPerYear)`: means, standard deviations, the covariance $\sigma_{ic}$ and correlation of $\Delta c$ with the log market return, the mean log real risk-free rate and the Sharpe ratio, per period and annualised (reuse `annualiseMean` and `annualiseVolatility`).

      Pricing under lognormal power utility, $M_{t+1} = \delta\,e^{-\gamma\Delta c_{t+1}}$:
      - `impliedRiskAversion(moments)`: $\gamma = (\mathbb{E}[r_i - r_f] + \tfrac12\sigma_i^2)/\sigma_{ic}$, and the bound-style value $\gamma \approx SR/\sigma_c$ that holds when the correlation is one.
      - `impliedRiskFree(delta, gamma, mean, sd)` and `impliedTimeDiscount(riskFree, gamma, mean, sd)`: the log risk-free rate $-\log\delta + \gamma\mu - \tfrac12\gamma^2\sigma_c^2$ and its inverse, the $\delta$ that matches a given rate (above one is the risk-free rate puzzle).
      - `crraSdfMoments(delta, gamma, mean, sd)`: the exact lognormal $\mathbb{E}[M]$, $\sigma(M)$ and $\sigma(M)/\mathbb{E}[M] = \sqrt{e^{\gamma^2\sigma_c^2} - 1}$, and `crraHjPath(gammas, delta, mean, sd)`, the curve these trace in the $(\mathbb{E}[M], \sigma(M))$ plane as $\gamma$ rises, for the `HJBound` preset of chapter 35.

      Notation. The style guide uses $\delta$ for the time-discount factor, $M_{t+1} = \delta(C_{t+1}/C_t)^{-\gamma}$, while the curriculum's $r_f = \delta + \gamma g - \tfrac12\gamma^2\sigma_c^2$ uses $\delta$ for the rate of time preference: follow §3 and write $-\log\delta$. §3 gives $g$ to the GMM moment function: choose the symbols for the mean and standard deviation of $\Delta c$ (for example $\mu_c$ and $\sigma_c$) and for $\sigma_{ic}$, check each against §3, and add them to one "Part IX" block of the §3 table, each with the clash it avoids. The other Part IX library task adds rows to the same block: whichever merges first creates the block heading; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: `annualConsumption` on the first years matches a hand computation from the raw cells; `crraSdfMoments` matches the moments of `crraSdf` over many seeded normal draws (state the tolerance); `impliedRiskFree` and `impliedTimeDiscount` invert each other to 1e-12; `impliedRiskAversion` recovers $\gamma$ from moments built with a known $\gamma$; `quarterlySample` agrees with `quarterlyPanel` on the shared quarters; and pinned values on the committed data for the annual 1930–2025 sample, the annual postwar sample and the quarterly sample: $\mu_c$, $\sigma_c$, the correlation, the equity premium, the implied $\gamma$ both ways, and the $\delta$ that matches the mean risk-free rate at that $\gamma$. Reuse `crraSdf`, `hjBoundSharpe`, `cayInputs`, `quarterlyExcessReturns`, the moments helpers and the RNG helpers of `src/lib/math/rng.ts`; do not copy them. Out of scope: chapters, widgets, and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - '`docs/STYLE_GUIDE.md` §3 has a Part IX block with the consumption-moment symbols, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/consumptionPuzzle.ts`, its test, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-consumption-measurement
    title: 'Library: time averaging, the NIPA filter and its inverse'
    milestone: M-11
    why: >-
      SC-7 and M-11. Chapter 36 shows how the way NIPA builds consumption smooths it: averaging a random walk over a
      period makes its growth autocorrelated, and a filter on the reported series hides part of its volatility.
      Kroencke (2017) inverts the filter to recover an unfiltered series, which raises the volatility of consumption
      growth and its covariance with returns. Nothing in `src/lib` does this. The maths needs no dataset, so this
      task starts at once.
    scope: |-
      Add `src/lib/finance/consumptionMeasurement.ts` and `src/lib/finance/consumptionMeasurement.test.ts`. Read first: the entry of chapter 36 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the SDF and consumption table, the predictability table where $\phi$ is AR(1) persistence, and the Part VI to Part VIII blocks), `src/lib/stats/var.ts` (`sampleAutocorrelation`, `simulateAR1`), `src/lib/stats/autocorr.ts` (`autocorrelations`) and `src/lib/math/rng.ts`.

      Readings. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/Kroencke2017.pdf` (Kroencke, "Asset Pricing Without Garbage", ZEW working paper dated 2013; cite the 2017 *Journal of Finance* article and name working-paper pages) with `pdftotext -layout`, and cite pages in doc comments for anything you take from it: the filter model and its inverse (eq. 9, pdf page 14), the split of the unfilter parameter into time aggregation and filtering (his $\phi = \alpha \times \nu$, pdf pages 13–14), and the values of the parameter he recommends (pdf page 15). He credits the time-averaging result to Working (1960) and Breeden, Gibbons & Litzenberger (1989), which are not in `source/papers/`: derive the result in a doc comment and cite it only as Kroencke reports it.

      Functions (decimal log growth rates):
      - `simulateTimeAveraging(seed, options)`: a seeded random walk in log consumption at a fine step (for example daily, with drift and volatility options), the level averaged over each period of `stepsPerPeriod` steps, and the growth of the averages next to the growth of the end-of-period levels.
      - `timeAveragedAutocorrelation(stepsPerPeriod)` and `timeAveragedVarianceRatio(stepsPerPeriod)`: the exact first-order autocorrelation of the growth of period averages of a driftless random walk, $(n^2 - 1)/(2(2n^2 + 1))$ for $n$ steps a period, which tends to $1/4$, and the ratio of its variance to the variance of point-to-point growth, which tends to $2/3$. Derive both in a doc comment.
      - `nipaFilter(trueGrowth, weight)`: the curriculum's filter $\Delta c^{\text{NIPA}}_t = (1 - \varphi)\Delta c_t + \varphi\,\Delta c^{\text{NIPA}}_{t-1}$, with a stated start value; and `unfilter(nipaGrowth, weight)`, its inverse $\Delta c_t = (\Delta c^{\text{NIPA}}_t - \varphi\,\Delta c^{\text{NIPA}}_{t-1})/(1 - \varphi)$, which loses the first observation.
      - `fourthQuarterGrowth(dates, c)`: annual growth from the fourth quarter of one year to the fourth quarter of the next, from quarterly log consumption such as `cayInputs(...).c`, the Q4-Q4 measure that Kroencke compares with annual averages.

      Notation. §3 gives $\phi$ to AR(1) persistence. Choose the symbol for the filter weight (for example $\varphi$; check that §3 leaves it free and that it renders apart from $\phi$ in KaTeX at the site's font size, or choose another), and add it, with the averaging period length, to the "Part IX" block of the §3 table, each with the clash it avoids. The two parameterisations differ: Kroencke's unfilter parameter is one minus the curriculum's weight (his $\Delta\hat y_t = [\Delta\hat c_t - (1 - \phi)\Delta\hat c_{t-1}]/\phi$). Use the curriculum's weight in the code, state the mapping in a doc comment and in the §3 row, and give a function or constant that converts Kroencke's recommended values. The other Part IX library task adds rows to the same block: whichever merges first creates the block heading; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: `timeAveragedAutocorrelation` is 0 for one step a period and within 1e-3 of 0.25 for 250; the sample autocorrelation and variance ratio of `simulateTimeAveraging` over a long seeded path lie within stated bands of the exact values; `unfilter(nipaFilter(x, w), w)` returns `x` to 1e-12 after the first observation for several weights; `nipaFilter` with weight 0 is the identity; the variance of filtered white noise is $(1 - \varphi)/(1 + \varphi)$ times the original (state the band on a seeded path); the Kroencke conversion maps his recommended values to the curriculum's weights; and `fourthQuarterGrowth` on a hand-built quarterly path. Reuse `sampleAutocorrelation`, `autocorrelations` and the RNG helpers of `src/lib/math/rng.ts`; do not copy them. Out of scope: chapters, widgets, data loading and edits to files other than those named.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - '`docs/STYLE_GUIDE.md` §3 has a Part IX block with the filter-weight symbol and its mapping to Kroencke''s parameter, and the outcome lists each new symbol with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/consumptionMeasurement.ts`, its test, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: chapter-35
