format: goal-proposal/v1
task: TASK-040
add:
  - ref: data-gsw-svensson
    title: 'Data: the Svensson parameters of the GSW curve, end of month'
    milestone: M-14
    why: >-
      SC-4, SC-7 and M-14. Chapter 44 estimates an affine model the way Adrian, Crump & Moench (2013) do: monthly
      excess returns of bonds of 6 to 120 months over the one-month yield. Those need yields at monthly maturities,
      including maturities below one year, and `gsw-zero-coupon` holds only the 1- to 30-year yields. The same
      Federal Reserve CSV publishes the six Svensson parameters from which GSW compute every yield; Adrian, Crump &
      Moench rebuild their curves from those parameters (pdf p. 16). The CSV is public, with no credentials.
    scope: |-
      Add one dataset to the data pipeline, from the source `gsw-zero-coupon` already uses. Set up `.venv` as `docs/DATA.md` describes before `npm run data`. Read first: `docs/DATA.md` (file contract, the `gsw-zero-coupon` row and its build note "take the final daily source observation of each completed month"), `scripts/data/fetch.py` (the GSW download and its month-end rule), `src/lib/data/series.ts` and `src/lib/data/series.test.ts`.

      Dataset: `gsw-svensson-parameters`, from `https://www.federalreserve.gov/data/yield-curve-tables/feds200628.csv`: the columns `BETA0`, `BETA1`, `BETA2`, `BETA3` (percent) and `TAU1`, `TAU2` (years), on exactly the dates of the committed `gsw-zero-coupon` (1985-11-29 to 2026-09-30, the last daily observation of each completed month), through the same month-end helper; do not write a second one. Keep source units; compute no yields (the library task that follows does that). Check each column name and unit against the CSV header before you use it. If a parameter is missing in a month, keep the month with a null, and list the months in the outcome.

      Keep `gsw-zero-coupon` as committed. GSW is "subject to revision" (`docs/DATA.md`), so a fresh download can change its yields, and chapters 40 to 42 pin numbers on them: restore that file with `git checkout -- src/data/series/gsw-zero-coupon.json`, and restore any other JSON file `npm run data` changes, and say so in the outcome. The new file's dates must equal the committed GSW dates; a test checks this.

      Docs. In `docs/DATA.md`, add the row to the sources table (same Board terms and GSW citation as `gsw-zero-coupon`), update the dataset count in the opening lines and in "A normal run ... rewrites all ... outputs", and add a build note: the units, that the dates match `gsw-zero-coupon`, and that GSW yields at any maturity follow from the six parameters (name the source of the formula only as `docs/DATA.md` already cites GSW; the formula itself goes into the library). In `docs/CURRICULUM.md`, add `gsw-svensson-parameters` to the **Data:** line of chapter 44; change nothing else there.

      Touch only: `scripts/data/fetch.py`, the new JSON file in `src/data/series/`, `src/lib/data/series.ts` (one new `seriesColumns` entry), `src/lib/data/series.test.ts` (schema test, three raw-source cells, and the test that the dates equal those of `gsw-zero-coupon`), `docs/DATA.md` and `docs/CURRICULUM.md`. The JSON file stays under 100 KB. Out of scope: library maths, chapters and widgets. If the download is blocked, stop with `Goal-Blocked` and name the exact file the owner must download.

      Where jobs run: this is small work (one public CSV, seconds), so it runs on the MacBook. It reads no CRSP, option or tick data; nothing goes to the cluster or the CEMFI PC.
    acceptance:
      - '`npm run data` writes `src/data/series/gsw-svensson-parameters.json`, and the outcome states its first and last date, row count, size and any month with a null.'
      - '`npm test` passes, including the new schema, raw-cell and matching-dates tests.'
      - '`npm run build` passes.'
      - '`git status --short` shows only the files named above and this task''s outcome file; `src/data/series/gsw-zero-coupon.json` is unchanged.'
    verify: |-
      npm ci
      npm run data
      git checkout -- src/data/series/gsw-zero-coupon.json
      git status --short
      npm test
      npm run build
      du -k src/data/series/gsw-svensson-parameters.json
  - ref: data-fred-macro-debt
    title: 'Data: FRED monthly activity and inflation, and federal debt held by the public to GDP'
    milestone: M-14
    why: >-
      SC-4, SC-7 and M-14. Chapter 45 asks whether growth and inflation forecast bond returns beyond the yield curve,
      as Bauer & Hamilton (2018) and Duffee (2011) do; the pipeline has no activity series and its only inflation
      series, `infl` of `goyal-welch-monthly`, ends in 2025-12. Chapter 46 regresses the corporate–Treasury spread on
      the log of government debt to GDP, as Krishnamurthy & Vissing-Jorgensen (2012) do; the spread's yields are
      committed (`AAA`, `BAA` and `lty` of `goyal-welch-annual`), but debt to GDP is not. The "Data wanted later"
      table of `docs/CURRICULUM.md` lists it for chapter 46. FRED serves all of them with no API key.
    scope: |-
      Add two datasets to the data pipeline, from FRED, with no credentials. Set up `.venv` as `docs/DATA.md` describes before `npm run data`. Read first: `docs/DATA.md` (file contract and the notes of the FRED datasets), `scripts/data/fetch.py` (its FRED helpers and the FRED entries in `build_all`), `src/lib/data/series.ts` and `src/lib/data/series.test.ts`.

      Datasets:
      - `fred-macro-monthly`, from `https://fred.stlouisfed.org/graph/fredgraph.csv?id=INDPRO,CPIAUCSL,CFNAI`: industrial production (`INDPRO`, index), the consumer price index for all urban consumers (`CPIAUCSL`, seasonally adjusted index) and the Chicago Fed National Activity Index (`CFNAI`, a weighted average of standardised indicators, 0 = trend growth). Monthly, keeping the months with all three fields (CFNAI starts in 1967-03). Keep source units; compute no growth rates or averages (the library does that). Bauer & Hamilton's growth measure is the three-month average of CFNAI (`/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/BauerHamilton2018.pdf`, pdf p. 20); Duffee uses industrial production growth and CPI inflation (`/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/Duffee2013.pdf`, pdf p. 40). Read each series' terms on its FRED page: if CFNAI may not be redistributed, drop it, keep the other two, and say so in the outcome.
      - `fred-debt-gdp-annual`: federal debt held by the public as a percent of GDP, annual. Krishnamurthy & Vissing-Jorgensen use the face value of publicly held debt over GDP (`/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/KrishnamurthyVissingJorgensen2012.pdf`, pdf p. 2). Use `FYPUGDA188S` if its FRED page confirms that definition; otherwise use the FRED series for the same quantity with the longest annual history, and record the choice and why. Say in the build note whether the years are fiscal or calendar years.
      Check each ID and unit against the CSV header and the FRED series page before you use it; if FRED has renamed or discontinued one, use the current series for the same quantity and record the swap, as the cay notes do.

      Docs. In `docs/DATA.md`, add both rows to the sources table (terms and citation of each source: the Board for `INDPRO`, BLS for `CPIAUCSL`, the Chicago Fed for `CFNAI`, and the source FRED names for the debt series), update the dataset count in the opening lines and in "A normal run ... rewrites all ... outputs", and add a bullet for each under "File contract and transformations" with its units and first and last date. In `docs/CURRICULUM.md`, add `fred-macro-monthly` to the **Data:** line of chapter 45, add `fred-debt-gdp-annual` and `goyal-welch-annual` to that of chapter 46, and delete the chapter-46 row of "Data wanted later", whose two series are then committed (Aaa and Baa in `goyal-welch-annual`); change nothing else there.

      Touch only: `scripts/data/fetch.py`, the two new JSON files in `src/data/series/`, `src/lib/data/series.ts` (two new `seriesColumns` entries), `src/lib/data/series.test.ts` (schema test and three raw-source cells for each, as for the others), `docs/DATA.md` and `docs/CURRICULUM.md`. `npm run data` rebuilds every dataset; if it changes any other JSON file, restore it with `git checkout -- <file>` and say so in the outcome. Each JSON file stays under 100 KB. Out of scope: library maths, chapters and widgets. If a download is blocked, stop with `Goal-Blocked` and name the exact file the owner must download.

      Where jobs run: this is small work (public FRED CSVs, seconds), so it runs on the MacBook. It reads no CRSP, option or tick data; nothing goes to the cluster or the CEMFI PC.
    acceptance:
      - '`npm run data` writes `src/data/series/fred-macro-monthly.json` and `src/data/series/fred-debt-gdp-annual.json`, and the outcome states the first and last date, row count and size of each, and the series ID chosen for debt to GDP.'
      - '`npm test` passes, including the new schema and raw-cell tests.'
      - '`npm run build` passes.'
      - '`git status --short` shows only the files named above and this task''s outcome file.'
    verify: |-
      npm ci
      npm run data
      git status --short
      npm test
      npm run build
      du -k src/data/series/fred-macro-monthly.json src/data/series/fred-debt-gdp-annual.json
  - ref: lib-affine
    title: 'Library: Gaussian affine term structure models, bond pricing recursions, risk-neutral yields and the term premium'
    milestone: M-14
    why: >-
      SC-7 and M-14. Part XII prices bonds from a state that follows a VAR, a short rate linear in the state and
      prices of risk linear in the state. All four chapters use the recursions for $A_n$ and $B_n$: chapter 43 drags
      a model's state and prices of risk, chapter 44 feeds estimated parameters into them, chapter 45 inverts them
      to recover the state from yields, and chapter 46 reads its spreads against the term structure. `src/lib` has
      VAR(1) estimation (`fitVAR1`) and bond arithmetic (`bonds.ts`) but no model that prices bonds. Needs no data
      task, so it starts at once.
    scope: |-
      Add `src/lib/finance/affine.ts` and `src/lib/finance/affine.test.ts`. Read first: the entries of chapters 43–46 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the "Bonds and the term structure" table, the predictability table with $\phi$, $\mu_x$, $v_{t+1}$ and the VAR matrix $A$, the Returns and prices table with $\mu$ and $\Sigma$, and the SDF table), `src/lib/stats/var.ts` (`fitVAR1`, `forecastVAR1`), `src/lib/finance/bonds.ts` (`YieldCurve`, `logPrices`, `forwardRates`), `src/lib/math/linalg.ts` and `src/lib/math/rng.ts`.

      Readings. Open with `pdftotext -layout` and cite pages in doc comments for anything you take from it: `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/AdrianCrumpMoench2013.pdf` (New York Fed Staff Report 340, revised April 2013; cite the 2013 *Journal of Financial Economics* article and name working-paper pdf pages; printed page = pdf page − 2): the VAR of the state, eqs. (1)–(2), pdf p. 6; the exponentially affine pricing kernel and the prices of risk, eqs. (4)–(5), pdf p. 7; the expected excess return, eqs. (8)–(10), pdf p. 7; the affine yields and the recursions, eqs. (21)–(27), pdf p. 11; $\beta^{(n)\prime} = B_n'$, eq. (28), the role of $\sigma^2$, and the risk-neutral parameters $A^{RF}_n$, $B^{RF}_n$ with $\lambda_0 = \lambda_1 = 0$, pdf p. 12. Campbell, Lo & MacKinlay (1997), Ch. 11, is a book that is not in `source/papers/` (see `docs/READINGS.md`): take no fact from it.

      Units and parameter form. One period is one month; rates are decimal log rates per month, and the functions that return yields annualise by 12 (say so in each doc comment). Write the model once, in Adrian, Crump & Moench's form: $X_{t+1} = \mu + \Phi X_t + v_{t+1}$ with $v_{t+1} \sim N(0, \Sigma)$, the short rate $\delta_0 + \delta_1'X_t$, and prices of risk $\lambda_0 + \lambda_1 X_t$ that enter the recursions as $\mu - \lambda_0$ and $\Phi - \lambda_1$. The curriculum's Key math writes $X_{t+1} = \mu + \Phi X_t + \Sigma\varepsilon_{t+1}$ and the recursions with $\Sigma\lambda_0$ and $\Sigma\lambda_1$: derive in a doc comment that the two are the same model when the paper's $\lambda_0$, $\lambda_1$ equal the curriculum's times its $\Sigma$, and test it. Keep the optional $\tfrac12\sigma^2$ term of eq. (25) (default 0) and say what it is.

      Functions:
      - `affineLoadings(model, maxN)`: $A_n$ and $B_n$ for $n = 0, \dots, \mathit{maxN}$ from the recursions, with $A_0 = 0$, $B_0 = 0$, $A_1 = -\delta_0$, $B_1 = -\delta_1$; and the same with $\lambda_0 = \lambda_1 = 0$ (risk-neutral).
      - `affineYields(model, X, maturities)`: log yields $-(A_n + B_n'X)/n$, annualised, for a state $X$; `riskNeutralYields` the same with the risk-neutral loadings, which equal the average expected short rate over the bond's life (derive why in a doc comment, as the paper states on pdf p. 12); `termPremium` the gap, $\mathit{tp}^{(n)}_t$ in §3's symbol.
      - `expectedExcessReturn(model, X, n)`: the one-month expected log excess return of the $n$-month bond, from eqs. (10) and (28), with the convexity term.
      - `simulateAffine(seed, model, months, options)`: a seeded path of the state, from its unconditional mean unless a start is given, with the yields, risk-neutral yields and term premia of chosen maturities on each date, and an option to add seeded i.i.d. measurement error to the yields (chapter 45 uses it).
      - `oneFactorModel(params)` and `twoFactorModel(params)`: models for chapter 43's widget, set by readable parameters (the mean and monthly persistence of the short rate, its shock volatility, and the constant and slope of the price of risk; for two factors, a second factor that moves the slope of the curve, with its own persistence and correlation), each with a doc comment on what moving the parameter does to the curve. Give default parameters whose average curve on the annual grid is near the mean GSW curve of 1985-11 to 2026-09 (state the fit and the gap at 1, 5 and 10 years in the outcome; fit by hand or with `src/lib/math/optimize.ts`).
      - `invertState(model, yields, maturities, Q)`: the state that the yields imply, $X_t = (Q'B)^{-1}(Q'y_t - Q'A)$ with $A$, $B$ stacked over the maturities and $Q$ a matrix of $K$ yield weights (for example the first $K$ principal-component loadings), when $Q'B$ is invertible; report its condition number, and return null when it is singular.

      Notation. §3 already defines $\mathit{tp}^{(n)}_t$ ("the model term premium of Part XII"), $y^{(n)}_t$, $p^{(n)}_t$, $rx^{(n)}_{t+1}$, and reserves $A_n$ for the affine intercept (the $\bar\phi^{(n)}_y$ row). The papers' other symbols clash with §3: $X_t$ with the payoff $X_{t+1}$; $\Phi$ with the VAR matrix $A$ of Chapter 5 and `fitVAR1`; $\mu$ and $\Sigma$ with a return's mean and covariance (§3 asks other covariances to carry a subscript, as $\Sigma_\varepsilon$); $\delta_0$, $\delta_1$ with the time-discount factor $\delta$; $\lambda_0$, $\lambda_1$ with the factor risk premia $\lambda$, the conditional premium $\lambda_t$ of Chapters 22–23 and the zero-beta rate $\lambda_0$ of Chapter 17; $B_n$ with the beta matrix $B$; $e_{t+1}$ with the residual of a 2×3 portfolio in Chapter 19. Choose one symbol for each (for example a subscript $X$ on the VAR's mean and covariance, $\mu_X$ and $\Sigma_X$, as §3 does with $\mu_x$; keep $\Phi$ for the state's VAR and say in the row that Chapter 5's $A$ is the same object), add each to the "Bonds and the term structure" table of §3 with the clash it avoids and the paper's symbol, and use them in every doc comment. The other Part XII library tasks add rows to the same table; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: for a one-factor model, $A_n$ and $B_n$ match the closed form of a Gaussian AR(1) short rate (derive it in the test) to 1e-12; with $\lambda_0 = \lambda_1 = 0$ and $\Sigma \to 0$ every yield equals the average expected short rate and the term premium is 0; the paper's form and the curriculum's form give the same loadings to 1e-12; the risk-neutral yield equals the average of `forecastVAR1` short-rate forecasts to 1e-12; `expectedExcessReturn` equals $p^{(n-1)}$ expected next month minus $p^{(n)}$ minus the short rate, computed from the loadings, to 1e-12; `invertState` recovers the state of a simulated date to 1e-10 without measurement error; `simulateAffine` is reproducible from its seed; and the default parameters' average curve against the GSW mean at 1, 5 and 10 years within a stated gap. Reuse `forecastVAR1`, `matMul`, `inverse`, `solve` and the RNG helpers; do not copy them. Out of scope: estimation on data (the next library task), chapters, widgets, and edits to files other than those named.

      Where jobs run: unit tests on small made-up data and the committed GSW file, seconds, on the MacBook.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - 'The outcome states the derivation that maps the paper''s prices of risk to the curriculum''s, and the gap of the default parameters'' average curve to the GSW mean at 1, 5 and 10 years.'
      - '`docs/STYLE_GUIDE.md` §3 "Bonds and the term structure" has a row for each new symbol, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/affine.ts`, its test, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-acm
    title: 'Library: the Adrian–Crump–Moench three-step estimator on GSW, with fitted yields and the term premium'
    milestone: M-14
    after: [lib-affine, data-gsw-svensson]
    why: >-
      SC-7 and M-14. Chapter 44 estimates an affine model with three sets of OLS regressions instead of maximum
      likelihood, and reads the history of the term premium it implies. It needs monthly yields at monthly
      maturities from the Svensson parameters, principal components of yields as the state, the three steps of
      Adrian, Crump & Moench, and the recursions of the affine library to turn the estimates into yields and term
      premia. `ols.ts` and `pca.ts` give the regressions and components; nothing chains them.
    scope: |-
      Add `src/lib/finance/acm.ts` and its test file, and add `svenssonYield` and `gswMonthlyCurve` to `src/lib/finance/bonds.ts` with tests. Read first: the entries of chapters 43 and 44 in `docs/CURRICULUM.md`, `docs/STYLE_GUIDE.md` §3 (the "Bonds and the term structure" table, with the rows the affine library added), the `gsw-zero-coupon` and `gsw-svensson-parameters` rows and notes of `docs/DATA.md`, `src/lib/finance/affine.ts` (from the library task this task depends on), `src/lib/finance/bonds.ts`, `src/lib/stats/pca.ts` (`pca`, `scores`, `gswYields`), `src/lib/stats/ols.ts`, `src/lib/stats/var.ts` (`fitVAR1`) and `src/lib/math/linalg.ts`.

      Readings. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/AdrianCrumpMoench2013.pdf` (New York Fed Staff Report 340, revised April 2013; cite the 2013 *Journal of Financial Economics* article and name working-paper pdf pages; printed page = pdf page − 2) with `pdftotext -layout`, and cite pages in doc comments for anything you take from it: the return-generating process and its stacked form, eqs. (12)–(13), pdf p. 8; the three steps, eqs. (14)–(17), pdf p. 9; the asymptotic variance of $\hat\beta$, eqs. (19)–(20), pdf p. 10; the recursions and $\beta^{(n)\prime} = B_n'$, eqs. (25)–(28), pdf pp. 11–12; the data (GSW curves rebuilt from their parameters at 3 to 120 months, the one-month yield as the risk-free rate, excess returns at $n$ = 6, 18, 24, …, 60, 84 and 120 months, $N = 12$), pdf p. 16; the sample 1987-01 to 2011-12, $T = 300$, and $\delta_0$, $\delta_1$ from a regression of the short rate on the factors, pdf p. 17; five factors, pdf p. 19; $\mu = 0$ for demeaned components and the size of the yield pricing errors (Table 2), pdf p. 20; the prices of risk (Table 3), pdf p. 21; $\hat\beta^{(n)}$ against $B_n$ (Fig. 4), pdf pp. 24 and 61. Gürkaynak, Sack & Wright (2007) is the data citation, not a reading: state about it only what `docs/DATA.md` states.

      Functions (one period is one month; decimal log rates per month inside, annualised by 12 on output):
      - `svenssonYield(params, m)` in `bonds.ts`: the continuously compounded yield at maturity $m$ years from `BETA0`–`BETA3`, `TAU1`, `TAU2` (write the formula in the doc comment and say where it comes from as `docs/DATA.md` does). `gswMonthlyCurve(params, monthsList)`: the panel of log yields at the chosen maturities in months, on the dates of `gsw-svensson-parameters`. GSW fit coupon bonds, so the fitted curve is least reliable at the shortest maturities; name that limit in a code comment, and say where Adrian, Crump & Moench use it anyway.
      - `acmInputs(params, options)`: the yields at 3 to 120 months, their first $K$ principal components (default 5) of demeaned yields as the state $X_t$, the one-month yield as the short rate, and the monthly log excess returns at the paper's 12 maturities, each from `gswMonthlyCurve` with $p^{(n-1)}_{t+1}$ read from the next month's curve; a date range option with the paper's sample (1987-01 to 2011-12) and ours (all months) as named presets.
      - `acmEstimate(inputs)`: step 1, the VAR of the state by OLS, its residuals $\hat v_{t+1}$ and $\hat\Sigma$; step 2, each excess return on a constant, $\hat v_{t+1}$ and $X_t$, giving $\hat a$, $\hat\beta$, $\hat c$ and $\hat\sigma^2$; step 3, $\hat\lambda_0$ and $\hat\lambda_1$ from the cross-sectional regressions of eqs. (16)–(17); $\hat\delta_0$, $\hat\delta_1$ from the short rate on the state; and the model for `affine.ts` that these define. Standard errors of $\hat\beta$ from eq. (20); say in the doc comment that the paper's $\hat\lambda$ errors (its Appendix) are not computed.
      - `acmStepRegressions(inputs, estimate, choice)`: the one-regressor scatter of each step for a `RegressionLab` view: a state component on its own lag (step 1), one maturity's excess return on one innovation (step 2), and, across the 12 maturities, $\hat c$ for one state component against $\hat\beta$ for the same component (step 3), each with its fitted line and the value the full estimate gives, so the chapter can say what a single regression shows and what it leaves out.
      - `acmFit(inputs, estimate, maturities)`: fitted yields, risk-neutral yields and term premia from the affine recursions for every month; the yield pricing errors by maturity (mean and standard deviation in basis points, as Table 2); and $\hat\beta^{(n)}$ against $B_n$ (as Fig. 4).

      Notation. Use the §3 symbols the affine library added for the state, its VAR, the short rate and the prices of risk. Add rows to the "Bonds and the term structure" table for the new ones: the exposures $\beta^{(n)}$ (a factor exposure, as $\beta$ is everywhere in §3, with the maturity superscript), the paper's $a$, $c$ and $e_{t+1}$ of step 2 ($a$ is an intercept here too; choose a symbol for $c$, which is log consumption, and for the return pricing error, which the paper writes $e_{t+1}$, a 2×3 residual in Chapter 19), its $\sigma^2$ (§3's $\sigma$ is a return's standard deviation; for example $\sigma^2_e$ or the symbol you choose for the error), $B^\star$ and $\iota$ (§3 writes the vector of ones $\mathbf{1}$), each with the clash it avoids and the paper's symbol. The other Part XII library tasks add rows to the same table; rebase on `origin/main` before you finish and keep every row. Keep the KaTeX macro check in `npm test` green.

      Tests against reference values, each stated in the test: `svenssonYield` reproduces every committed `SVENY01`–`SVENY30` of `gsw-zero-coupon` within the rounding of the published values (state the largest gap; a larger one means GSW revised the curve, and the outcome must say so); on data simulated from a known affine model with `simulateAffine`, a long seeded sample recovers $\Phi$, $\beta$, $\lambda_0$ and $\lambda_1$ within stated bands, and the fitted yields equal the simulated ones to a stated tolerance; $\hat\beta^{(n)}$ is close to $B_n$ on our data (state the largest gap, as Fig. 4); step 3 equals eq. (18) computed directly, to 1e-10; and pinned values on the committed data for both presets: $\hat\lambda_0$, the diagonal of $\hat\lambda_1$, the yield pricing errors at 2 and 10 years, and the 10-year term premium at three named months. State the time one `acmEstimate` plus `acmFit` takes on the test machine; it must be low enough to run in a widget on load. Reuse `pca`, `scores`, `ols`, `fitVAR1` and the functions of `affine.ts` and `bonds.ts`; do not copy them. Out of scope: chapters, widgets, and edits to files other than those named.

      Where jobs run: the estimate runs in milliseconds on the committed files, on the MacBook. Nothing goes to the cluster or the CEMFI PC.
    acceptance:
      - 'Every exported function has a test against a reference value, and `npm test` passes, including the KaTeX macro check.'
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - 'The outcome compares, on the paper''s sample preset, our yield pricing errors with Table 2 (pdf p. 20) and our $\hat\lambda_0$ and $\hat\lambda_1$ with Table 3 (pdf p. 21), marked as theirs, and says why they may differ (GSW vintage, our rebuild of the curve, sign and scale of the principal components).'
      - 'The outcome states the largest gap between `svenssonYield` and the committed GSW yields, and the measured time of one estimate and fit.'
      - '`docs/STYLE_GUIDE.md` §3 "Bonds and the term structure" has rows for the new symbols, and the outcome lists each with the clash it avoids.'
      - '`git status --short` shows only `src/lib/finance/acm.ts`, its test, `src/lib/finance/bonds.ts`, its test, `docs/STYLE_GUIDE.md` and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-spanning
    title: 'Library: spanning regressions of bond excess returns on yield components and macro variables, with the Bauer–Hamilton bootstrap'
    milestone: M-14
    after: [lib-affine, data-fred-macro-debt]
    why: >-
      SC-7 and M-14. Chapter 45 asks whether anything outside the yield curve forecasts bond returns. In an
      invertible affine model the state is a function of yields, so the answer should be no; regressions say yes,
      but with persistent predictors and overlapping returns their size is wrong. The chapter needs the regressions,
      the bootstrap under the spanning null and a seeded version whose predictor persistence the reader can move.
      `stambaugh.ts` simulates one persistent predictor; nothing tests a block of them against yield components.
    scope: |-
