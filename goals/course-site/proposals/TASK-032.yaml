add:
  - ref: lib-time-series-tests
    title: 'Library: the F distribution, time-series factor regressions and GRS'
    milestone: M-6
    why: >-
      SC-7 and M-6. Chapter 16 needs the factor panel of the 25 size–B/M portfolios, asset-by-asset time-series
      regressions with alpha standard errors, the GRS statistic with its F p-value, and the Sharpe-ratio reading of
      GRS in `src/lib`, with tests. Chapters 17 and 18 reuse the panel and the first pass through the two-pass library.
    scope: |-
      Add `src/lib/math/distributions.ts`, `src/lib/finance/timeSeriesTests.ts` and their `.test.ts` files. Read first: the entry of chapter 16 in `docs/CURRICULUM.md`, the notation table in `docs/STYLE_GUIDE.md` §3 (subsection "Factor models and tests"), the French notes in `docs/DATA.md` (returns and factors are percent per month; divide by 100), `src/components/plots/capmSample.ts` (how chapter 7 lines up `ff3-monthly` and `ff25-size-bm-monthly`), `src/lib/stats/ols.ts`, `src/lib/finance/portfolio.ts` and `src/lib/math/linalg.ts`. Open `/Users/jesusvillotamiranda/GitHub/empirical-finance-lbs/source/papers/GibbonsRossShanken1987.pdf` (Gibbons, Ross & Shanken, Econometrica 1989) with `pdftotext -layout` for the statistic and its finite-sample F distribution, and cite its page in a doc comment.

      Functions in `src/lib/math/distributions.ts`:
      - `logGamma(x)` and `regularizedBeta(x, a, b)` (the regularized incomplete beta $I_x(a, b)$, by a continued fraction).
      - `fCdf(x, d1, d2)` and `fSurvival(x, d1, d2)`, the F distribution's CDF and upper tail.

      Functions in `src/lib/finance/timeSeriesTests.ts`:
      - `factorPanel(ff3, ff25, { start, end?, model })` with `model` `'capm'` (Mkt-RF) or `'ff3'` (Mkt-RF, SMB, HML): returns `{ dates, names, excess, factors, factorNames }` as decimal monthly values, `excess` a T × 25 matrix of $R^e_{i,t} = R_{i,t} - R^f_t$, `factors` a T × K matrix. Fail with a `RangeError` when the two series' dates do not line up, as `capmSample` does.
      - `timeSeriesRegressions(excess, factors)`: for each asset the OLS fit of $R^e_{i,t} = \alpha_i + \beta_i' f_t + \varepsilon_{i,t}$, returning `{ alpha, alphaSE, alphaT, beta, residuals, residualCovariance, factorMean, factorCovariance }`. State in a doc comment which divisor each covariance uses (GRS uses the maximum-likelihood divisor $T$).
      - `grs(excess, factors)` returns `{ statistic, pValue, df1, df2, sharpeAll2, sharpeFactors2 }` with $GRS = \tfrac{T-N-K}{N}\big(1 + \bar f'\hat\Sigma_f^{-1}\bar f\big)^{-1}\hat\alpha'\hat\Sigma_\varepsilon^{-1}\hat\alpha$, `df1` $= N$, `df2` $= T-N-K$, and the two squared maximum Sharpe ratios, so that $\hat\alpha'\hat\Sigma_\varepsilon^{-1}\hat\alpha = SR^2_{\text{all}} - SR^2_f$ can be shown. Use the notation of `docs/STYLE_GUIDE.md` §3 in comments ($\Sigma_f$, $\Sigma_\varepsilon$), not the curriculum's $\Omega$, $\Sigma$.
      - `sharpeFrontiers(excess, factors, sdGrid)`: the mean–standard deviation frontier of the factors alone and of factors plus test assets on a common grid, for chapter 16's `GRSGeometry`.

      Tests against reference values, each stated in the test: `logGamma` at 0.5, 1, 5 and 10.5; `fCdf` at tabulated quantiles (for example $F_{0.95}(2, 10) = 4.1028$, $F_{0.99}(5, 20) = 4.1027$, and one case with $d_2 \ge 500$), with `fCdf + fSurvival = 1`; `timeSeriesRegressions` on a small hand-computed panel; the in-sample identity $\hat\alpha'\hat\Sigma_\varepsilon^{-1}\hat\alpha = SR^2_{\text{all}} - SR^2_f$ to 1e-10 on a seeded panel; `grs` equal to zero when every alpha is zero; with $N = 1$, GRS equals the squared alpha $t$-statistic up to the stated divisor scaling; and one test per model (`capm`, `ff3`) on the committed data that pins the sample dates (from 1963-07) and the GRS statistic and p-value. Reuse `ols`, `sampleMeans`, `sampleCovariance`, `maxSharpeSquared`, `frontier`, `inverse` and `solve`; do not copy them. Seed any simulation with `src/lib/math/rng.ts`. Out of scope: chapters, widgets, edits to docs or to code outside the files named.
    acceptance:
      - Every exported function has a test against a reference value, and `npm test` passes.
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - '`git status --short` shows only the four files named and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
  - ref: lib-two-pass
    title: 'Library: two-pass regressions, Fama–MacBeth and the Shanken correction'
    milestone: M-6
    after: [lib-time-series-tests]
    why: >-
      SC-7 and M-6. Chapters 17 and 18 need the cross-sectional regression of mean returns on betas (OLS and GLS),
      monthly Fama–MacBeth slopes with their standard errors, the cross-sectional R², the Shanken correction and a
      seeded errors-in-variables simulation in `src/lib`, with tests.
    scope: |-
      Add `src/lib/finance/crossSection.ts` and `src/lib/finance/crossSection.test.ts`. Read first: the entries of chapters 17 and 18 in `docs/CURRICULUM.md`, the notation table in `docs/STYLE_GUIDE.md` §3, and `src/lib/finance/timeSeriesTests.ts` (from the library task this task depends on): take the first-pass betas, residual covariance and factor moments from `timeSeriesRegressions` and the data from `factorPanel`; do not refit them. No reading in `source/papers/` gives these formulas: Cochrane (2005), Ch. 12, is a book the owner has not supplied, and Fama & MacBeth (1973) and Shanken (1992) are not in `source/papers/`. Derive each formula in a doc comment from the model, and attribute nothing to those works beyond the names of the methods.

      Functions:
      - `crossSectionalRegression(beta, meanExcess, { intercept, weighting, residualCovariance? })` with `weighting` `'ols'` or `'gls'` (weights $\Sigma_\varepsilon^{-1}$): returns `{ lambda, lambda0?, alpha, fitted, r2 }`, with $\hat\lambda = (\hat\beta'\hat\beta)^{-1}\hat\beta'\bar R^e$ for OLS. Define the cross-sectional $R^2$ in a doc comment (with and without intercept) and use that one definition everywhere.
      - `famaMacBeth(excess, beta, { intercept })`: the slopes $\hat\lambda_t$ of each month's cross-sectional OLS regression, their mean, $\mathrm{se}(\hat\lambda) = \sigma(\hat\lambda_t)/\sqrt{T}$, the $t$-statistics, the running mean of $\hat\lambda_t$ for a frame-by-frame figure, and the monthly fitted values.
      - `shankenCorrection(beta, residualCovariance, factorCovariance, lambda, T, { weighting })`: the naive and the corrected covariance of $\hat\lambda$, $\mathrm{Var}(\hat\lambda) = \tfrac1T\big[(\beta'\beta)^{-1}\beta'\Sigma_\varepsilon\beta(\beta'\beta)^{-1}(1 + c) + \Sigma_f\big]$ with $c = \lambda'\Sigma_f^{-1}\lambda$, the GLS version, and $c$ itself. Write the formula with §3 notation ($\Sigma_\varepsilon$, $\Sigma_f$) and say in a doc comment that $c$ is a squared Sharpe ratio.
      - `simulateTwoPass(seed, { N, T, beta, lambda, factorSharpe, residualSd, replications })`: a seeded one-factor world; for each replication the estimated betas, $\hat\lambda$, and the naive and Shanken standard errors; returns the draws of the first replication (for a scatter of $\hat\beta_i$ around $\beta_i$) and the coverage of the naive and corrected 95% intervals over all replications.

      Tests against reference values, each stated in the test: `crossSectionalRegression` on a hand-computed three-asset case, OLS and GLS; with constant betas, the Fama–MacBeth mean slope equals the cross-sectional regression on mean returns, and the Fama–MacBeth standard error equals $\sqrt{\tfrac1T(\beta'\beta)^{-1}\beta'\hat\Sigma\beta(\beta'\beta)^{-1}}$ with the divisor-$T$ return covariance (exact identities, to 1e-10); `shankenCorrection` with $\lambda = 0$ gives $c = 0$ and adds only $\Sigma_f/T$; GLS with a traded factor included as a test asset gives $\hat\lambda$ equal to the factor's sample mean; `simulateTwoPass` gives the same output for the same seed, and with many replications and a high factor Sharpe ratio the corrected coverage is closer to 95% than the naive one (state the numbers); and one test on the committed data (FF3 on the 25 portfolios from 1963-07) that pins $\hat\lambda$, the Fama–MacBeth $t$-statistics, the cross-sectional $R^2$ and the naive and corrected standard errors. Reuse `ols`, `inverse`, `solve`, `transpose`, `matMul` and the RNG helpers; do not copy them. Out of scope: chapters, widgets, edits to docs or to code outside the files named.
    acceptance:
      - Every exported function has a test against a reference value, and `npm test` passes.
      - '`npm run build` passes (`astro check` reports 0 errors).'
      - '`git status --short` shows only `src/lib/finance/crossSection.ts`, its test and this task''s outcome file.'
    verify: |-
      npm ci
      npm test
      npm run build
      git status --short
